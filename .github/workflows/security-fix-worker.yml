name: Security Fix Worker

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo)'
        required: true
        type: string
      severity:
        description: 'Minimum severity to fix'
        required: false
        default: 'critical'
        type: choice
        options:
          - critical
          - high
          - medium
          - low
          - all
      dry_run:
        description: 'Preview only, no changes'
        required: false
        default: false
        type: boolean
      job_id:
        description: 'Job ID for tracking (from git-steer)'
        required: false
        type: string

jobs:
  fix-vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Parse target repo
        id: parse
        run: |
          echo "owner=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          echo "repo=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.repo }}

      - name: Checkout target repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Get Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ALERTS=$(gh api "repos/${{ inputs.target_repo }}/dependabot/alerts" \
            --jq '[.[] | select(.state == "open") | {
              package: .dependency.package.name,
              ecosystem: .dependency.package.ecosystem,
              severity: .security_advisory.severity,
              fix_version: .security_vulnerability.first_patched_version.identifier,
              manifest: .dependency.manifest_path,
              cve: .security_advisory.cve_id,
              summary: .security_advisory.summary
            }]')
          echo "alerts<<EOF" >> $GITHUB_OUTPUT
          echo "$ALERTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(echo "$ALERTS" | jq length)" >> $GITHUB_OUTPUT

      - name: Filter by severity
        id: filter
        env:
          ALERTS_JSON: ${{ steps.alerts.outputs.alerts }}
        run: |
          SEVERITY="${{ inputs.severity }}"
          case $SEVERITY in
            critical) PATTERN='critical' ;;
            high)     PATTERN='critical|high' ;;
            medium)   PATTERN='critical|high|medium' ;;
            low)      PATTERN='critical|high|medium|low' ;;
            all)      PATTERN='.*' ;;
          esac
          FILTERED=$(echo "$ALERTS_JSON" | jq --arg pat "$PATTERN" '[.[] | select(.severity | test($pat))]')
          FIXABLE=$(echo "$FILTERED" | jq '[.[] | select(.fix_version != null)]')
          echo "filtered<<EOF" >> $GITHUB_OUTPUT
          echo "$FIXABLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          COUNT=$(echo "$FIXABLE" | jq length)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Exit if nothing to fix
        if: steps.filter.outputs.count == '0'
        run: echo "No fixable vulnerabilities at ${{ inputs.severity }}+ severity." && exit 0

      - name: Fix npm dependencies
        if: steps.filter.outputs.count != '0'
        env:
          FILTERED_JSON: ${{ steps.filter.outputs.filtered }}
        run: |
          find . -name "package.json" -not -path "*/node_modules/*" | while read pkg; do
            DIR=$(dirname "$pkg")
            MANIFEST_ALERTS=$(echo "$FILTERED_JSON" | jq --arg m "$pkg" '[.[] | select(.manifest == $m or .ecosystem == "npm")]')
            if [ "$(echo "$MANIFEST_ALERTS" | jq length)" -gt 0 ]; then
              cd "$DIR" && rm -f package-lock.json
              npm install --package-lock-only 2>/dev/null || true
              npm audit fix 2>/dev/null || true
              cd - > /dev/null
            fi
          done

      - name: Fix Python dependencies
        if: steps.filter.outputs.count != '0'
        env:
          FILTERED_JSON: ${{ steps.filter.outputs.filtered }}
        run: |
          find . -name "requirements*.txt" -type f | while read req; do
            PY_ALERTS=$(echo "$FILTERED_JSON" | jq '[.[] | select(.ecosystem == "pip")]')
            if [ "$(echo "$PY_ALERTS" | jq length)" -gt 0 ]; then
              echo "$PY_ALERTS" | jq -r '.[] | "\(.package) \(.fix_version)"' | while read PKG VER; do
                [ -n "$VER" ] && [ "$VER" != "null" ] && sed -i "s/^${PKG}[=<>!~].*/${PKG}>=${VER}/I" "$req" 2>/dev/null || true
              done
            fi
          done
          find . -name "pyproject.toml" -type f | while read toml; do
            DIR=$(dirname "$toml")
            [ -f "$DIR/uv.lock" ] && cd "$DIR" && rm -f uv.lock && uv lock 2>/dev/null || true && cd - > /dev/null
          done

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Create branch and commit
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: commit
        env:
          FILTERED_JSON: ${{ steps.filter.outputs.filtered }}
        run: |
          BRANCH="security/fix-${{ inputs.severity }}-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git config user.name "git-steer[bot]"
          git config user.email "git-steer[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          PACKAGES=$(echo "$FILTERED_JSON" | jq -r '[.[].package] | unique | join(", ")')
          git add -A
          git commit -m "fix(security): patch ${{ steps.filter.outputs.count }} vulns ($PACKAGES)"
          git push -u origin "$BRANCH"

      - name: Ensure labels
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ inputs.target_repo }}"
          gh label create "security"     --color "d73a4a" --repo "$REPO" 2>/dev/null || true
          gh label create "dependencies" --color "0075ca" --repo "$REPO" 2>/dev/null || true
          gh label create "automated"    --color "bfd4f2" --repo "$REPO" 2>/dev/null || true
          SEVERITY="${{ inputs.severity }}"
          case $SEVERITY in critical) C="b60205";; high) C="ff9800";; medium) C="fbca04";; *) C="0e8a16";; esac
          gh label create "severity:$SEVERITY" --color "$C" --repo "$REPO" 2>/dev/null || true

      - name: Build PR body
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: body
        run: |
          python3 - << 'PYEOF'
          import json, os, sys

          alerts = json.loads(os.environ.get("ALERTS", "[]"))
          count = len(alerts)
          severity = "${{ inputs.severity }}"

          rows = "\n".join(
              f"| {a.get('cve') or 'N/A'} | {a['package']} | {a['severity'].upper()} | {a.get('fix_version') or 'N/A'} |"
              for a in alerts
          )
          by_sev = {s: sum(1 for a in alerts if a["severity"] == s) for s in ["critical","high","medium","low"]}

          body = f"""## Security Fix

          This PR addresses **{count}** security vulnerabilities.

          ### Vulnerabilities Fixed

          | CVE | Package | Severity | Fix Version |
          |-----|---------|----------|-------------|
          {rows}

          ### Summary
          Critical: {by_sev['critical']}  High: {by_sev['high']}  Medium: {by_sev['medium']}  Low: {by_sev['low']}

          ---
          Generated by [git-steer](https://github.com/ry-ops/git-steer)"""

          with open("/tmp/pr_body.md", "w") as f:
              f.write(body)
          print("PR body written.")
          PYEOF
        env:
          ALERTS: ${{ steps.filter.outputs.filtered }}

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_URL=$(gh pr create \
            --title "fix(security): Patch ${{ steps.filter.outputs.count }} ${{ inputs.severity }}+ vulnerabilities" \
            --body-file /tmp/pr_body.md \
            --head "${{ steps.commit.outputs.branch }}" \
            --label "security,dependencies,automated,severity:${{ inputs.severity }}" \
            --repo "${{ inputs.target_repo }}")
          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "number=$(echo "$PR_URL" | grep -oE '[0-9]+$')" >> $GITHUB_OUTPUT

      - name: Merge Pull Request
        if: steps.pr.outputs.number != '' && inputs.dry_run == false
        id: wait-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          REPO="${{ inputs.target_repo }}"
          MERGE_RESP=$(gh api "repos/$REPO/pulls/$PR_NUM/merge" \
            -X PUT \
            -f merge_method=squash \
            -f commit_title="fix(security): Patch ${{ steps.filter.outputs.count }} ${{ inputs.severity }}+ vulnerabilities" \
            -f commit_message="Auto-merged by git-steer." 2>&1)
          echo "$MERGE_RESP"
          MERGED=$(echo "$MERGE_RESP" | jq -r '.merged // false' 2>/dev/null)
          if [ "$MERGED" = "true" ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "PR #$PR_NUM merged."
          else
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "Merge failed: $MERGE_RESP"
          fi

      - name: Verify fixes applied
        if: steps.wait-merge.outputs.merged == 'true'
        id: verify
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Waiting 30s for Dependabot..."
          sleep 30
          REMAINING=$(gh api "repos/${{ inputs.target_repo }}/dependabot/alerts" \
            --jq '[.[] | select(.state == "open")] | length' 2>/dev/null || echo "unknown")
          echo "remaining_alerts=$REMAINING" >> $GITHUB_OUTPUT
          if [ "$REMAINING" = "0" ]; then
            echo "result=all_clear" >> $GITHUB_OUTPUT
            echo "Verification passed - no open alerts remaining."
          else
            echo "result=partial" >> $GITHUB_OUTPUT
            echo "Verification: $REMAINING alert(s) still open."
          fi

      - name: Dry run summary
        if: inputs.dry_run == true
        env:
          FILTERED_JSON: ${{ steps.filter.outputs.filtered }}
        run: |
          echo "Dry run - would fix ${{ steps.filter.outputs.count }} vulnerabilities:"
          echo "$FILTERED_JSON" | jq -r '.[] | "  \(.package) (\(.severity)): \(.cve // "N/A")"'
          git diff --stat || echo "No file changes."

      - name: Report to git-steer-state
        if: always() && inputs.job_id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          jq -n \
            --arg id "${{ inputs.job_id }}" \
            --arg status "${{ job.status }}" \
            --arg repo "${{ inputs.target_repo }}" \
            --arg severity "${{ inputs.severity }}" \
            --arg fixed "${{ steps.filter.outputs.count || '0' }}" \
            --arg merged "${{ steps.wait-merge.outputs.merged || 'na' }}" \
            --arg verify "${{ steps.verify.outputs.result || 'na' }}" \
            --arg remaining "${{ steps.verify.outputs.remaining_alerts || 'na' }}" \
            --arg pr_url "${{ steps.pr.outputs.url || '' }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{id:$id,status:$status,repo:$repo,severity:$severity,fixed:($fixed|tonumber),merged:$merged,verify:$verify,remaining:$remaining,pr_url:$pr_url,ts:$ts}'
