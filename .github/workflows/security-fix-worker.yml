name: Security Fix Worker

# ADR-007 single gated remediation path. Three jobs:
#   fix          — apply non-destructive dependency bumps, open/refresh one PR
#   gate         — the shared ADR-005 functional-integrity gate (reusable)
#   disposition  — merge on GO, hold (needs-human-merge) otherwise
# There is exactly ONE remediation worker and ONE gate (C-005-005); the
# security-sweep-worker and Fabric paths were retired in favor of this.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo)'
        required: true
        type: string
      severity:
        description: 'Minimum severity to fix'
        required: false
        default: 'critical'
        type: choice
        options: [critical, high, medium, low, all]
      package_dir:
        description: 'Scope the fix to ONE package/manifest dir (e.g. frontend, backend, "." for root). Empty = whole repo. Per-package scope lets the clean packages auto-merge while a broken one is held alone (ADR-007).'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Preview only, no changes'
        required: false
        default: false
        type: boolean
      job_id:
        description: 'Job ID for tracking (from git-steer)'
        required: false
        type: string

# Least privilege by default; jobs widen only what they need (CodeQL hardening).
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      branch: ${{ steps.commit.outputs.branch }}
      pr_number: ${{ steps.pr.outputs.number }}
      pr_url: ${{ steps.pr.outputs.url }}
      count: ${{ steps.alerts.outputs.count }}
    steps:
      - name: Parse target repo
        id: parse
        run: |
          echo "owner=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          echo "repo=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.repo }}

      - name: Get Dependabot alerts and detect ecosystems
        id: alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ALERTS=$(gh api --paginate "repos/${{ inputs.target_repo }}/dependabot/alerts" \
            --jq '[.[] | select(.state == "open") | {
              package: .dependency.package.name,
              ecosystem: .dependency.package.ecosystem,
              severity: .security_advisory.severity,
              fix_version: .security_vulnerability.first_patched_version.identifier,
              manifest: .dependency.manifest_path,
              cve: .security_advisory.cve_id,
              summary: .security_advisory.summary
            }]' | jq -s 'add // []')

          SEVERITY="${{ inputs.severity }}"
          case $SEVERITY in
            critical) PATTERN='critical' ;;
            high)     PATTERN='critical|high' ;;
            medium)   PATTERN='critical|high|medium' ;;
            low)      PATTERN='critical|high|medium|low' ;;
            all)      PATTERN='.*' ;;
          esac

          FIXABLE=$(echo "$ALERTS" | jq --arg pat "$PATTERN" \
            '[.[] | select((.severity | test($pat)) and .fix_version != null)]')

          # Per-package scope (ADR-007): keep only alerts whose manifest dir
          # matches package_dir, so this PR touches exactly one buildable unit.
          # The manifest dir is dirname(manifest_path), or "." at the repo root.
          PKG_DIR="${{ inputs.package_dir }}"
          if [ -n "$PKG_DIR" ]; then
            FIXABLE=$(echo "$FIXABLE" | jq --arg d "$PKG_DIR" \
              '[.[] | select(((.manifest | if test("/") then (split("/")[:-1] | join("/")) else "." end)) == $d)]')
            SLUG=$(echo "$PKG_DIR" | sed 's#[/ ]#-#g; s#^\.$#root#')
            echo "branch=security/fix-$SLUG" >> $GITHUB_OUTPUT
          else
            echo "branch=security/fix-$SEVERITY" >> $GITHUB_OUTPUT
          fi

          echo "filtered<<EOF" >> $GITHUB_OUTPUT
          echo "$FIXABLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(echo "$FIXABLE" | jq length)" >> $GITHUB_OUTPUT
          echo "has_npm=$(echo "$FIXABLE" | jq '[.[] | select(.ecosystem == "npm")] | length > 0')" >> $GITHUB_OUTPUT
          echo "has_pip=$(echo "$FIXABLE" | jq '[.[] | select(.ecosystem == "pip")] | length > 0')" >> $GITHUB_OUTPUT
          echo "has_gomod=$(echo "$FIXABLE" | jq '[.[] | select(.ecosystem == "gomod")] | length > 0')" >> $GITHUB_OUTPUT

      - name: Exit if nothing to fix
        if: steps.alerts.outputs.count == '0'
        run: echo "No fixable vulnerabilities at ${{ inputs.severity }}+ severity." && exit 0

      - name: Checkout target repo
        if: steps.alerts.outputs.count != '0'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Setup Node.js
        if: steps.alerts.outputs.count != '0' && steps.alerts.outputs.has_npm == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }

      - name: Setup Python and uv
        if: steps.alerts.outputs.count != '0' && steps.alerts.outputs.has_pip == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Setup uv
        if: steps.alerts.outputs.count != '0' && steps.alerts.outputs.has_pip == 'true'
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Setup Go
        if: steps.alerts.outputs.count != '0' && steps.alerts.outputs.has_gomod == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: 'stable' }

      - name: Fix dependencies (non-destructive)
        if: steps.alerts.outputs.count != '0'
        env:
          FILTERED_JSON: ${{ steps.alerts.outputs.filtered }}
          HAS_NPM: ${{ steps.alerts.outputs.has_npm }}
          HAS_PIP: ${{ steps.alerts.outputs.has_pip }}
          HAS_GOMOD: ${{ steps.alerts.outputs.has_gomod }}
        run: |
          set +e
          # npm — apply Dependabot's OWN fix_version per alert. Do NOT delegate
          # to `npm audit fix`: that uses npm's registry advisory DB, which
          # diverges from GHSA/Dependabot, so it no-ops on the very alerts
          # OBSERVE flagged. Instead, for each alert we install the patched
          # version explicitly (direct deps) or pin it via `overrides`
          # (transitive deps), then re-resolve the lockfile. NEVER rm a lockfile.
          # The ADR-005 gate verifies the result (so aggressive-but-verified).
          if [ "$HAS_NPM" = "true" ]; then
            echo "$FILTERED_JSON" | jq -r '.[] | select(.ecosystem=="npm" and .fix_version!=null) | "\(.manifest)\t\(.package)\t\(.fix_version)"' \
              | while IFS=$'\t' read -r MANIFEST PKG FIXVER; do
              [ -z "$FIXVER" ] && continue
              DIR=$(dirname "$MANIFEST"); [ -d "$DIR" ] || DIR="."
              PJ="$DIR/package.json"
              [ -f "$PJ" ] || continue
              ( cd "$DIR"
                [ -f package-lock.json ] || npm install --package-lock-only --no-fund 2>/dev/null
                IS_DIRECT=$(node -e "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};process.stdout.write(d['$PKG']?'1':'0')" 2>/dev/null)
                if [ "$IS_DIRECT" = "1" ]; then
                  npm install "${PKG}@${FIXVER}" --package-lock-only --no-fund 2>/dev/null
                else
                  # transitive: pin the patched version via overrides, then re-resolve
                  node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.overrides=p.overrides||{};p.overrides['$PKG']='$FIXVER';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" 2>/dev/null
                  npm install --package-lock-only --no-fund 2>/dev/null
                fi
              ) || true
            done
          fi

          # Python — bump requirements pins + regenerate uv.lock (regen is safe;
          # uv lock rebuilds it from pyproject).
          if [ "$HAS_PIP" = "true" ]; then
            find . -name "requirements*.txt" -type f | while read req; do
              echo "$FILTERED_JSON" | jq -r '.[] | select(.ecosystem=="pip") | "\(.package) \(.fix_version)"' | while read PKG VER; do
                [ -n "$VER" ] && [ "$VER" != "null" ] && \
                  sed -i "s/^${PKG}[=<>!~].*/${PKG}>=${VER}/I" "$req" 2>/dev/null
              done
            done
            find . -name "pyproject.toml" -type f | while read toml; do
              DIR=$(dirname "$toml")
              [ -f "$DIR/uv.lock" ] && ( cd "$DIR" && uv lock 2>/dev/null ) || true
            done
          fi

          # Go modules
          if [ "$HAS_GOMOD" = "true" ]; then
            find . -name "go.mod" -not -path "*/vendor/*" | while read gomod; do
              DIR=$(dirname "$gomod")
              ( cd "$DIR"
                echo "$FILTERED_JSON" | jq -r '.[] | select(.ecosystem=="gomod") | "\(.package)@\(.fix_version)"' | while read PKG_VER; do
                  [ -n "$PKG_VER" ] && [ "$PKG_VER" != "@" ] && go get "$PKG_VER" 2>/dev/null
                done
                go mod tidy 2>/dev/null ) || true
            done
          fi
          exit 0

      - name: Guard — never delete a lockfile
        if: steps.alerts.outputs.count != '0'
        run: |
          # A remediation that DELETES a lockfile is destructive, not a fix.
          # Restore any deleted lockfile so it can never be committed.
          DELETED=$(git diff --name-only --diff-filter=D | grep -E '(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|uv\.lock|go\.sum)$' || true)
          if [ -n "$DELETED" ]; then
            echo "::warning::Refusing to delete lockfiles; restoring:"
            echo "$DELETED"
            echo "$DELETED" | xargs -r git checkout --
          fi

      - name: Check for changes
        id: changes
        if: steps.alerts.outputs.count != '0'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Create branch and commit
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: commit
        env:
          FILTERED_JSON: ${{ steps.alerts.outputs.filtered }}
        run: |
          BRANCH="${{ steps.alerts.outputs.branch }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git config user.name "git-steer[bot]"
          git config user.email "git-steer[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          PACKAGES=$(echo "$FILTERED_JSON" | jq -r '[.[].package] | unique | join(", ")')
          git add -A
          git commit -m "fix(security): patch ${{ steps.alerts.outputs.count }} vulns ($PACKAGES)"
          git push -f -u origin "$BRANCH"

      - name: Write PR body
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        env:
          FILTERED_JSON: ${{ steps.alerts.outputs.filtered }}
        run: |
          cat > /tmp/build_pr_body.py << 'SCRIPT'
          import json, os
          alerts = json.loads(os.environ["FILTERED_JSON"])
          rows = "\n".join(
              f"| {a.get('cve') or 'N/A'} | {a['package']} | {a['severity'].upper()} | {a.get('fix_version') or 'N/A'} |"
              for a in alerts)
          by_sev = {s: sum(1 for a in alerts if a["severity"] == s) for s in ["critical","high","medium","low"]}
          body = (
              "## Security Fix\n\n"
              f"This PR addresses **{len(alerts)}** security vulnerabilities (non-destructive lockfile bumps).\n\n"
              "| CVE | Package | Severity | Fix Version |\n|-----|---------|----------|-------------|\n"
              f"{rows}\n\n"
              f"- Critical: {by_sev['critical']}  High: {by_sev['high']}  Medium: {by_sev['medium']}  Low: {by_sev['low']}\n\n"
              "---\nMerge is gated by the ADR-005 functional-integrity gate. Generated by "
              "[git-steer](https://github.com/ry-ops/git-steer).")
          open("/tmp/pr_body.md", "w").write(body)
          SCRIPT
          python3 /tmp/build_pr_body.py

      - name: Create or refresh PR
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ inputs.target_repo }}"; SEVERITY="${{ inputs.severity }}"
          COUNT="${{ steps.alerts.outputs.count }}"; BRANCH="${{ steps.commit.outputs.branch }}"
          PKG_DIR="${{ inputs.package_dir }}"
          SCOPE=${PKG_DIR:+ in \`$PKG_DIR\`}
          TITLE="fix(security): Patch $COUNT vulnerabilities${PKG_DIR:+ in $PKG_DIR}"
          gh label create "security"     --color "d73a4a" --repo "$REPO" 2>/dev/null || true
          gh label create "dependencies" --color "0075ca" --repo "$REPO" 2>/dev/null || true
          gh label create "automated"    --color "bfd4f2" --repo "$REPO" 2>/dev/null || true
          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body-file /tmp/pr_body.md >/dev/null
            PR_NUM="$EXISTING"
          else
            PR_URL=$(gh pr create --title "$TITLE" \
              --body-file /tmp/pr_body.md --head "$BRANCH" \
              --label "security,dependencies,automated" --repo "$REPO")
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi
          echo "number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "url=$(gh pr view "$PR_NUM" --repo "$REPO" --json url --jq '.url')" >> $GITHUB_OUTPUT

      - name: Dry run summary
        if: inputs.dry_run == true && steps.alerts.outputs.count != '0'
        env:
          FILTERED_JSON: ${{ steps.alerts.outputs.filtered }}
        run: |
          echo "Dry run — would fix ${{ steps.alerts.outputs.count }} vulnerabilities:"
          echo "$FILTERED_JSON" | jq -r '.[] | "  \(.package) (\(.severity)): \(.cve // "N/A")"'
          git diff --stat || echo "No file changes."

  # ── ADR-005 functional-integrity gate — the ONE shared gate (C-005-005) ──
  gate:
    needs: fix
    if: needs.fix.outputs.has_changes == 'true' && inputs.dry_run == false
    uses: ./.github/workflows/verify-functional-form.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      ref: ${{ needs.fix.outputs.branch }}
      pr_number: ${{ needs.fix.outputs.pr_number }}
      scope: ${{ inputs.package_dir }}   # gate ONLY the package this PR changed
    secrets: inherit

  # ── disposition: GO auto-merges; anything else is held for a human ──────
  disposition:
    needs: [fix, gate]
    if: always() && needs.fix.outputs.pr_number != '' && inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Parse target repo
        id: parse
        run: |
          echo "owner=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          echo "repo=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f2)" >> $GITHUB_OUTPUT
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.repo }}

      - name: Merge on GO
        if: needs.gate.outputs.verdict == 'GO'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ inputs.target_repo }}"; PR_NUM="${{ needs.fix.outputs.pr_number }}"
          RESP=$(gh api "repos/$REPO/pulls/$PR_NUM/merge" -X PUT -f merge_method=squash \
            -f commit_title="fix(security): Patch ${{ needs.fix.outputs.count }} vulnerabilities${{ inputs.package_dir && format(' in {0}', inputs.package_dir) || '' }}" \
            -f commit_message="Auto-merged by git-steer (ADR-005 verdict: GO)." 2>&1) || true
          if [ "$(echo "$RESP" | jq -r '.merged // false' 2>/dev/null)" = "true" ]; then
            echo "PR #$PR_NUM merged (GO)."
          else
            echo "Direct merge blocked (branch protection?): $RESP"
            gh label create "needs-human-merge" --color "d93f0b" --repo "$REPO" 2>/dev/null || true
            gh pr edit "$PR_NUM" --repo "$REPO" --add-label "needs-human-merge" 2>/dev/null || true
            gh pr merge "$PR_NUM" --repo "$REPO" --squash --auto 2>/dev/null \
              && echo "Native auto-merge enabled." || echo "Enable 'Allow auto-merge' on $REPO, or merge #$PR_NUM manually."
          fi

      - name: Hold on non-GO
        if: needs.gate.outputs.verdict != 'GO'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERDICT: ${{ needs.gate.outputs.verdict }}
          DIMENSIONS: ${{ needs.gate.outputs.dimensions }}
          GATE_REPORT: ${{ needs.gate.outputs.report }}
        run: |
          REPO="${{ inputs.target_repo }}"; PR_NUM="${{ needs.fix.outputs.pr_number }}"
          gh label create "needs-human-merge" --color "d93f0b" \
            --description "Held by ADR-005 functional-integrity gate" --repo "$REPO" 2>/dev/null || true
          gh pr edit "$PR_NUM" --repo "$REPO" --add-label "needs-human-merge" 2>/dev/null || true
          # Build a self-explaining hold comment: verdict + dimensions + the
          # captured failure tail (so the human sees exactly what broke).
          {
            echo "🚦 **Functional-integrity gate: ${VERDICT:-ERROR}** (ADR-005) — auto-merge withheld, held for human review."
            echo ""
            echo "Dimensions: \`${DIMENSIONS:-[]}\`"
            echo ""
            printf '%s\n' "${GATE_REPORT:-}"
          } > /tmp/hold-comment.md
          gh pr comment "$PR_NUM" --repo "$REPO" --body-file /tmp/hold-comment.md 2>/dev/null || true
          echo "Held PR #$PR_NUM — verdict ${VERDICT:-ERROR}"

      - name: Report to git-steer-state
        if: always() && inputs.job_id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          jq -nc \
            --arg id "${{ inputs.job_id }}" --arg repo "${{ inputs.target_repo }}" \
            --arg severity "${{ inputs.severity }}" --arg fixed "${{ needs.fix.outputs.count }}" \
            --arg verdict "${{ needs.gate.outputs.verdict }}" --arg pr "${{ needs.fix.outputs.pr_url }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{id:$id,repo:$repo,severity:$severity,fixed:($fixed|tonumber? // 0),verdict:$verdict,pr_url:$pr,ts:$ts}'
