name: Security Fix Worker

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo)'
        required: true
        type: string
      severity:
        description: 'Minimum severity to fix'
        required: false
        default: 'critical'
        type: choice
        options:
          - critical
          - high
          - medium
          - low
          - all
      dry_run:
        description: 'Preview only, no changes'
        required: false
        default: false
        type: boolean
      job_id:
        description: 'Job ID for tracking (from git-steer)'
        required: false
        type: string

jobs:
  fix-vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Parse target repo
        id: parse
        run: |
          echo "owner=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          echo "repo=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.repo }}

      - name: Get Dependabot alerts and detect ecosystems
        id: alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ALERTS=$(gh api "repos/${{ inputs.target_repo }}/dependabot/alerts" \
            --jq '[.[] | select(.state == "open") | {
              package: .dependency.package.name,
              ecosystem: .dependency.package.ecosystem,
              severity: .security_advisory.severity,
              fix_version: .security_vulnerability.first_patched_version.identifier,
              manifest: .dependency.manifest_path,
              cve: .security_advisory.cve_id,
              summary: .security_advisory.summary
            }]')

          SEVERITY="${{ inputs.severity }}"
          case $SEVERITY in
            critical) PATTERN='critical' ;;
            high)     PATTERN='critical|high' ;;
            medium)   PATTERN='critical|high|medium' ;;
            low)      PATTERN='critical|high|medium|low' ;;
            all)      PATTERN='.*' ;;
          esac

          FIXABLE=$(echo "$ALERTS" | jq --arg pat "$PATTERN" \
            '[.[] | select((.severity | test($pat)) and .fix_version != null)]')

          echo "filtered<<EOF" >> $GITHUB_OUTPUT
          echo "$FIXABLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(echo "$FIXABLE" | jq length)" >> $GITHUB_OUTPUT
          echo "has_npm=$(echo "$FIXABLE" | jq '[.[] | select(.ecosystem == "npm")] | length > 0')" >> $GITHUB_OUTPUT
          echo "has_pip=$(echo "$FIXABLE" | jq '[.[] | select(.ecosystem == "pip")] | length > 0')" >> $GITHUB_OUTPUT
          echo "has_gomod=$(echo "$FIXABLE" | jq '[.[] | select(.ecosystem == "gomod")] | length > 0')" >> $GITHUB_OUTPUT

      - name: Exit if nothing to fix
        if: steps.alerts.outputs.count == '0'
        run: echo "No fixable vulnerabilities at ${{ inputs.severity }}+ severity." && exit 0

      - name: Checkout target repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Setup Node.js
        if: steps.alerts.outputs.has_npm == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Python and uv
        if: steps.alerts.outputs.has_pip == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup uv
        if: steps.alerts.outputs.has_pip == 'true'
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Setup Go
        if: steps.alerts.outputs.has_gomod == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 'stable'

      - name: Fix dependencies
        if: steps.alerts.outputs.count != '0'
        env:
          FILTERED_JSON: ${{ steps.alerts.outputs.filtered }}
          HAS_NPM: ${{ steps.alerts.outputs.has_npm }}
          HAS_PIP: ${{ steps.alerts.outputs.has_pip }}
          HAS_GOMOD: ${{ steps.alerts.outputs.has_gomod }}
        run: |
          # Fix npm in background
          if [ "$HAS_NPM" = "true" ]; then
            (
              find . -name "package.json" -not -path "*/node_modules/*" | while read pkg; do
                DIR=$(dirname "$pkg")
                MANIFEST_ALERTS=$(echo "$FILTERED_JSON" | jq --arg m "$pkg" '[.[] | select(.manifest == $m or .ecosystem == "npm")]')
                if [ "$(echo "$MANIFEST_ALERTS" | jq length)" -gt 0 ]; then
                  cd "$DIR"
                  rm -f package-lock.json
                  npm audit fix --package-lock-only 2>/dev/null || true
                  cd - > /dev/null
                fi
              done
            ) &
            NPM_PID=$!
          fi

          # Fix Python in background
          if [ "$HAS_PIP" = "true" ]; then
            (
              find . -name "requirements*.txt" -type f | while read req; do
                PY_ALERTS=$(echo "$FILTERED_JSON" | jq '[.[] | select(.ecosystem == "pip")]')
                if [ "$(echo "$PY_ALERTS" | jq length)" -gt 0 ]; then
                  echo "$PY_ALERTS" | jq -r '.[] | "\(.package) \(.fix_version)"' | while read PKG VER; do
                    [ -n "$VER" ] && [ "$VER" != "null" ] && \
                      sed -i "s/^${PKG}[=<>!~].*/${PKG}>=${VER}/I" "$req" 2>/dev/null || true
                  done
                fi
              done
              find . -name "pyproject.toml" -type f | while read toml; do
                DIR=$(dirname "$toml")
                if [ -f "$DIR/uv.lock" ]; then
                  cd "$DIR" && rm -f uv.lock && uv lock 2>/dev/null || true && cd - > /dev/null
                fi
              done
            ) &
            PIP_PID=$!
          fi

          # Fix Go modules in background
          if [ "$HAS_GOMOD" = "true" ]; then
            (
              GO_ALERTS=$(echo "$FILTERED_JSON" | jq '[.[] | select(.ecosystem == "gomod")]')
              find . -name "go.mod" -not -path "*/vendor/*" | while read gomod; do
                DIR=$(dirname "$gomod")
                cd "$DIR"
                echo "$GO_ALERTS" | jq -r '.[] | "\(.package)@\(.fix_version)"' | while read PKG_VER; do
                  [ -n "$PKG_VER" ] && [ "$PKG_VER" != "@" ] && \
                    go get "$PKG_VER" 2>/dev/null || true
                done
                go mod tidy 2>/dev/null || true
                cd - > /dev/null
              done
            ) &
            GOMOD_PID=$!
          fi

          # Wait for all
          [ -n "${NPM_PID:-}" ] && wait "$NPM_PID"
          [ -n "${PIP_PID:-}" ] && wait "$PIP_PID"
          [ -n "${GOMOD_PID:-}" ] && wait "$GOMOD_PID"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Create branch and commit
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: commit
        env:
          FILTERED_JSON: ${{ steps.alerts.outputs.filtered }}
        run: |
          # Deterministic branch: one stable head per severity per repo.
          # Re-runs reuse this branch (force-push) instead of spawning a new
          # timestamped branch + duplicate PR. See "Create or update PR" below.
          BRANCH="security/fix-${{ inputs.severity }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git config user.name "git-steer[bot]"
          git config user.email "git-steer[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          PACKAGES=$(echo "$FILTERED_JSON" | jq -r '[.[].package] | unique | join(", ")')
          git add -A
          git commit -m "fix(security): patch ${{ steps.alerts.outputs.count }} vulns ($PACKAGES)"
          # Force-push: idempotent refresh of the deterministic branch. If an
          # open PR already points at it, this updates that PR's diff in place.
          git push -f -u origin "$BRANCH"

      - name: Write PR body script
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        run: |
          cat > /tmp/build_pr_body.py << 'SCRIPT'
          import json, os
          alerts = json.loads(os.environ["FILTERED_JSON"])
          rows = "\n".join(
              f"| {a.get('cve') or 'N/A'} | {a['package']} | {a['severity'].upper()} | {a.get('fix_version') or 'N/A'} |"
              for a in alerts
          )
          by_sev = {s: sum(1 for a in alerts if a["severity"] == s) for s in ["critical","high","medium","low"]}
          body = (
              "## Security Fix\n\n"
              f"This PR addresses **{len(alerts)}** security vulnerabilities.\n\n"
              "### Vulnerabilities Fixed\n\n"
              "| CVE | Package | Severity | Fix Version |\n"
              "|-----|---------|----------|-------------|\n"
              f"{rows}\n\n"
              "### Summary\n"
              f"- Critical: {by_sev['critical']}  High: {by_sev['high']}  Medium: {by_sev['medium']}  Low: {by_sev['low']}\n\n"
              "---\n"
              "Generated by [git-steer](https://github.com/ry-ops/git-steer)"
          )
          open("/tmp/pr_body.md", "w").write(body)
          SCRIPT

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FILTERED_JSON: ${{ steps.alerts.outputs.filtered }}
        run: |
          REPO="${{ inputs.target_repo }}"
          SEVERITY="${{ inputs.severity }}"
          COUNT="${{ steps.alerts.outputs.count }}"
          BRANCH="${{ steps.commit.outputs.branch }}"

          # Ensure labels (fire-and-forget, parallel with PR body)
          (
            gh label create "security"     --color "d73a4a" --repo "$REPO" 2>/dev/null || true
            gh label create "dependencies" --color "0075ca" --repo "$REPO" 2>/dev/null || true
            gh label create "automated"    --color "bfd4f2" --repo "$REPO" 2>/dev/null || true
            case $SEVERITY in critical) C="b60205";; high) C="ff9800";; medium) C="fbca04";; *) C="0e8a16";; esac
            gh label create "severity:$SEVERITY" --color "$C" --repo "$REPO" 2>/dev/null || true
          ) &
          LABELS_PID=$!

          # Build PR body in parallel
          python3 /tmp/build_pr_body.py &
          BODY_PID=$!

          wait "$LABELS_PID"
          wait "$BODY_PID"

          # Idempotency guard: reuse an open PR already pointing at this head
          # instead of opening a duplicate. The force-push above refreshed its
          # diff; here we just realign the title/body.
          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$REPO" \
              --title "fix(security): Patch $COUNT $SEVERITY+ vulnerabilities" \
              --body-file /tmp/pr_body.md >/dev/null
            PR_NUM="$EXISTING"
            PR_URL=$(gh pr view "$PR_NUM" --repo "$REPO" --json url --jq '.url')
            echo "Reusing existing PR #$PR_NUM (refreshed)."
          else
            PR_URL=$(gh pr create \
              --title "fix(security): Patch $COUNT $SEVERITY+ vulnerabilities" \
              --body-file /tmp/pr_body.md \
              --head "$BRANCH" \
              --label "security,dependencies,automated,severity:$SEVERITY" \
              --repo "$REPO")
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #$PR_NUM."
          fi
          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "number=$PR_NUM" >> $GITHUB_OUTPUT

      # ── ADR-005 functional-integrity gate (CANARY: inlined in this one path) ──
      # Runs on the fixed branch BEFORE merge. Verdict logic mirrors the canonical,
      # unit-tested src/core/verdict.ts. To roll out to the other remediation paths,
      # extract these dimensions into a shared composite action (ADR-005 C-005-005).
      - name: Functional-integrity gate
        id: gate
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        run: |
          set +e
          BUILD=NOT_APPLICABLE; TEST=NOT_APPLICABLE; SMOKE=NOT_APPLICABLE; SURFACE=NOT_APPLICABLE

          # BUILD — deps resolve / lockfile coherent / compiles
          if [ -f package.json ]; then
            npm ci >/dev/null 2>&1 || npm install --no-audit --no-fund >/dev/null 2>&1
            if [ $? -ne 0 ]; then BUILD=FAIL
            elif node -e "process.exit(require('./package.json').scripts?.build?0:1)"; then
              npm run build >/dev/null 2>&1 && BUILD=PASS || BUILD=FAIL
            else BUILD=PASS; fi
          elif [ -f go.mod ]; then
            go build ./... >/dev/null 2>&1 && BUILD=PASS || BUILD=FAIL
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            { [ -f requirements.txt ] && pip install -r requirements.txt || pip install . ; } >/dev/null 2>&1 && BUILD=PASS || BUILD=FAIL
          fi

          # TEST — existing suite passes (NOT_APPLICABLE if none)
          if [ -f package.json ]; then
            HAS=$(node -e "const t=require('./package.json').scripts?.test||'';process.stdout.write(t&&!/no test specified/.test(t)?'1':'0')")
            [ "$HAS" = "1" ] && { npm test >/dev/null 2>&1 && TEST=PASS || TEST=FAIL; }
          elif [ -f go.mod ]; then
            if find . -name '*_test.go' | grep -q .; then go test ./... >/dev/null 2>&1 && TEST=PASS || TEST=FAIL; fi
          elif python -c "import pytest" 2>/dev/null && { [ -d tests ] || ls test_*.py >/dev/null 2>&1; }; then
            pytest -q >/dev/null 2>&1 && TEST=PASS || TEST=FAIL
          fi

          # SMOKE — declared npm entrypoint imports without immediate error
          if [ -f package.json ]; then
            MAIN=$(node -e "process.stdout.write(require('./package.json').main||'')")
            [ -n "$MAIN" ] && [ -f "$MAIN" ] && { timeout 30 node -e "require('./$MAIN')" >/dev/null 2>&1 && SMOKE=PASS || SMOKE=FAIL; }
          fi

          # SURFACE — NOT_APPLICABLE for batch fixes (no single from->to); per-bump SURFACE comes with the shared action
          VERDICT=$(node -e "const d=['$BUILD','$TEST','$SMOKE','$SURFACE'];process.stdout.write(d.includes('FAIL')?'NO-GO':(d.includes('PASS')?'GO':'GO-UNVERIFIED'))")
          {
            echo "build=$BUILD"; echo "test=$TEST"; echo "smoke=$SMOKE"; echo "surface=$SURFACE"; echo "verdict=$VERDICT";
          } >> $GITHUB_OUTPUT
          echo "Functional-integrity verdict: $VERDICT  (BUILD=$BUILD TEST=$TEST SMOKE=$SMOKE SURFACE=$SURFACE)"

      - name: Merge Pull Request
        if: steps.pr.outputs.number != '' && inputs.dry_run == false && steps.gate.outputs.verdict == 'GO'
        id: wait-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          REPO="${{ inputs.target_repo }}"
          MERGE_RESP=$(gh api "repos/$REPO/pulls/$PR_NUM/merge" \
            -X PUT \
            -f merge_method=squash \
            -f commit_title="fix(security): Patch ${{ steps.alerts.outputs.count }} ${{ inputs.severity }}+ vulnerabilities" \
            -f commit_message="Auto-merged by git-steer." 2>&1)
          echo "$MERGE_RESP"
          MERGED=$(echo "$MERGE_RESP" | jq -r '.merged // false' 2>/dev/null)
          if [ "$MERGED" = "true" ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "PR #$PR_NUM merged."
          else
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "Direct merge blocked (likely branch protection): $MERGE_RESP"
            # #3: handle the merge-failure case instead of silently exiting and
            # re-firing next dispatch. (a) Flag for human visibility, and
            # (b) enable GitHub-native auto-merge so the PR lands on its own once
            # required checks/approvals are satisfied — no re-dispatch needed.
            gh label create "needs-human-merge" --color "d93f0b" \
              --description "Auto-merge blocked by branch protection" --repo "$REPO" 2>/dev/null || true
            gh pr edit "$PR_NUM" --repo "$REPO" --add-label "needs-human-merge" 2>/dev/null || true
            if gh pr merge "$PR_NUM" --repo "$REPO" --squash --auto 2>/dev/null; then
              echo "Native auto-merge enabled; PR will land when branch protection clears."
            else
              echo "Native auto-merge unavailable — enable 'Allow auto-merge' on $REPO, or merge #$PR_NUM manually."
            fi
          fi

      # ── ADR-005 disposition: non-GO verdict is held for human review ──
      - name: Hold for review (non-GO verdict)
        if: steps.pr.outputs.number != '' && inputs.dry_run == false && steps.gate.outputs.verdict != '' && steps.gate.outputs.verdict != 'GO'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ inputs.target_repo }}"
          PR_NUM="${{ steps.pr.outputs.number }}"
          gh label create "needs-human-merge" --color "d93f0b" \
            --description "Held by ADR-005 functional-integrity gate" --repo "$REPO" 2>/dev/null || true
          gh pr edit "$PR_NUM" --repo "$REPO" --add-label "needs-human-merge" 2>/dev/null || true
          gh pr comment "$PR_NUM" --repo "$REPO" --body "$(printf '🚦 **Functional-integrity gate: %s** (ADR-005)\n\n| Dimension | Result |\n|---|---|\n| BUILD | %s |\n| TEST | %s |\n| SMOKE | %s |\n| SURFACE | %s |\n\nAuto-merge withheld — held for human review. A GO verdict is required to auto-merge.' \
            "${{ steps.gate.outputs.verdict }}" "${{ steps.gate.outputs.build }}" "${{ steps.gate.outputs.test }}" "${{ steps.gate.outputs.smoke }}" "${{ steps.gate.outputs.surface }}")" 2>/dev/null || true
          echo "Held PR #$PR_NUM for review — verdict ${{ steps.gate.outputs.verdict }}"

      - name: Verify fixes applied
        if: steps.wait-merge.outputs.merged == 'true'
        id: verify
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ inputs.target_repo }}"
          for i in $(seq 1 12); do
            REMAINING=$(gh api "repos/$REPO/dependabot/alerts" \
              --jq '[.[] | select(.state == "open")] | length' 2>/dev/null || echo "unknown")
            echo "Poll $i: $REMAINING open alerts"
            if [ "$REMAINING" = "0" ] || [ "$REMAINING" = "unknown" ]; then break; fi
            sleep 5
          done
          echo "remaining_alerts=$REMAINING" >> $GITHUB_OUTPUT
          if [ "$REMAINING" = "0" ]; then
            echo "result=all_clear" >> $GITHUB_OUTPUT
            echo "Verification passed - no open alerts remaining."
          else
            echo "result=partial" >> $GITHUB_OUTPUT
            echo "Verification: $REMAINING alert(s) still open."
          fi

      - name: Dry run summary
        if: inputs.dry_run == true
        env:
          FILTERED_JSON: ${{ steps.alerts.outputs.filtered }}
        run: |
          echo "Dry run - would fix ${{ steps.alerts.outputs.count }} vulnerabilities:"
          echo "$FILTERED_JSON" | jq -r '.[] | "  \(.package) (\(.severity)): \(.cve // "N/A")"'
          git diff --stat || echo "No file changes."

      - name: Report to git-steer-state
        if: always() && inputs.job_id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          jq -n \
            --arg id "${{ inputs.job_id }}" \
            --arg status "${{ job.status }}" \
            --arg repo "${{ inputs.target_repo }}" \
            --arg severity "${{ inputs.severity }}" \
            --arg fixed "${{ steps.alerts.outputs.count || '0' }}" \
            --arg merged "${{ steps.wait-merge.outputs.merged || 'na' }}" \
            --arg verdict "${{ steps.gate.outputs.verdict || 'na' }}" \
            --arg dimensions "BUILD=${{ steps.gate.outputs.build || 'na' }} TEST=${{ steps.gate.outputs.test || 'na' }} SMOKE=${{ steps.gate.outputs.smoke || 'na' }} SURFACE=${{ steps.gate.outputs.surface || 'na' }}" \
            --arg verify "${{ steps.verify.outputs.result || 'na' }}" \
            --arg remaining "${{ steps.verify.outputs.remaining_alerts || 'na' }}" \
            --arg pr_url "${{ steps.pr.outputs.url || '' }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{id:$id,status:$status,repo:$repo,severity:$severity,fixed:($fixed|tonumber),merged:$merged,verdict:$verdict,dimensions:$dimensions,verify:$verify,remaining:$remaining,pr_url:$pr_url,ts:$ts}'
