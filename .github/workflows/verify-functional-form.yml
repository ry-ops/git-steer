name: Verify Functional Form

# Reusable functional-integrity gate (ADR-005), monorepo-aware (ADR-007 Move B).
# Runs AFTER a fix is applied and BEFORE merge, on the fix branch, and emits a
# GO / NO-GO / GO-UNVERIFIED verdict the caller uses to gate the merge
# (C-005-001). Implemented ONCE here and invoked by every remediation path
# (C-005-005). Discovery + per-package BUILD/TEST/SMOKE + verdict aggregation
# live in scripts/gate/run-gate.mjs; aggregation mirrors src/core/verdict.ts
# (the canonical, unit-tested source). Verdicts are recorded to
# git-steer-state/state/verdicts.jsonl for audit (C-005-006 / ADR-007 Move C).

on:
  workflow_call:
    inputs:
      target_repo: { required: true, type: string }    # owner/repo to verify
      ref:         { required: true, type: string }     # fix branch/sha to check out
      pr_number:   { required: false, type: string, default: '' }
      bump_from:   { required: false, type: string, default: '' }  # SURFACE: old version
      bump_to:     { required: false, type: string, default: '' }  # SURFACE: new version
    outputs:
      verdict:
        value: ${{ jobs.verify.outputs.verdict }}
      dimensions:
        value: ${{ jobs.verify.outputs.dimensions }}
  workflow_dispatch:
    inputs:
      target_repo: { required: true, type: string }
      ref:         { required: true, type: string }
      pr_number:   { required: false, type: string, default: '' }
      bump_from:   { required: false, type: string, default: '' }
      bump_to:     { required: false, type: string, default: '' }

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      dimensions: ${{ steps.gate.outputs.dimensions }}
    steps:
      - name: Parse target
        id: parse
        run: |
          echo "owner=$(echo '${{ inputs.target_repo }}' | cut -d/ -f1)" >> $GITHUB_OUTPUT
          echo "repo=$(echo '${{ inputs.target_repo }}' | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Generate token (target repo)
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.repo }}

      - name: Checkout fix branch (target, ephemeral — ADR-002 zero-footprint)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          path: target

      - name: Checkout git-steer (the gate runner)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: gitsteer
          fetch-depth: 1

      # Polyglot monorepos carry more than one ecosystem (e.g. npm frontend +
      # python backend), so set up all three toolchains unconditionally.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with: { go-version: 'stable' }
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with: { python-version: '3.12' }

      # ── Monorepo-aware functional-integrity gate (ADR-005 / ADR-007 Move B) ──
      - name: Functional-integrity gate
        id: gate
        run: |
          node gitsteer/scripts/gate/run-gate.mjs target \
            --from "${{ inputs.bump_from }}" --to "${{ inputs.bump_to }}"

      # ── Verdict provenance to git-steer-state (C-005-006 / ADR-007 Move C) ──
      - name: Generate token (state repo)
        id: state-token
        if: ${{ always() && steps.gate.outputs.verdict != '' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          owner: ry-ops
          repositories: git-steer-state

      - name: Record verdict
        if: ${{ always() && steps.gate.outputs.verdict != '' }}
        env:
          GH_TOKEN: ${{ steps.state-token.outputs.token }}
          REPO: ${{ inputs.target_repo }}
          PR: ${{ inputs.pr_number }}
          REF: ${{ inputs.ref }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          DIMENSIONS: ${{ steps.gate.outputs.dimensions }}
          PACKAGES: ${{ steps.gate.outputs.packages }}
        run: |
          set -e
          REC=$(jq -nc \
            --arg repo "$REPO" --arg pr "$PR" --arg ref "$REF" \
            --arg verdict "$VERDICT" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson dims "${DIMENSIONS:-[]}" --argjson pkgs "${PACKAGES:-[]}" \
            '{repo:$repo, pr:(if $pr=="" then null else ($pr|tonumber) end), branch:$ref, verdict:$verdict, dimensions:$dims, packages:$pkgs, ts:$ts}')
          # append-only read-modify-write of state/verdicts.jsonl
          EXIST=$(gh api repos/ry-ops/git-steer-state/contents/state/verdicts.jsonl --jq '{c:.content,s:.sha}' 2>/dev/null || echo '{}')
          SHA=$(echo "$EXIST" | jq -r '.s // empty')
          PREV=$(echo "$EXIST" | jq -r '.c // ""' | tr -d '\n' | base64 -d 2>/dev/null || echo "")
          printf '%s\n%s\n' "$PREV" "$REC" | sed '/^$/d' > /tmp/verdicts.jsonl
          CONTENT=$(base64 -w0 < /tmp/verdicts.jsonl 2>/dev/null || base64 < /tmp/verdicts.jsonl | tr -d '\n')
          gh api repos/ry-ops/git-steer-state/contents/state/verdicts.jsonl -X PUT \
            -f message="verdict: $VERDICT for $REPO@$REF" \
            -f content="$CONTENT" ${SHA:+-f sha="$SHA"} >/dev/null
          echo "Recorded verdict $VERDICT for $REPO@$REF"

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## Functional-Integrity Verdict: ${{ steps.gate.outputs.verdict }}"
            echo ""
            echo '```json'
            echo '${{ steps.gate.outputs.dimensions }}'
            echo '```'
            echo ""
            echo "Target: \`${{ inputs.target_repo }}@${{ inputs.ref }}\` · PR: ${{ inputs.pr_number }}"
            echo "_GO auto-merges; NO-GO / GO-UNVERIFIED are held (ADR-005 C-005-003/004)._"
          } >> $GITHUB_STEP_SUMMARY
