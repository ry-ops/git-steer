name: Lockfiles

# Regenerates package-lock.json files on a PR's branch when a manifest
# changes, so lockfiles are produced here on GitHub (Node 24 / npm 11),
# never on a workstation. To request a fresh resolution, delete the lockfile
# in the PR.
#
# The result is committed through the GraphQL createCommitOnBranch mutation
# with a git-steer App token scoped to this one repository. GitHub signs
# those commits (main requires verified signatures), and App pushes, unlike
# GITHUB_TOKEN pushes, trigger CI on the new head. The follow-up run finds
# nothing to change, so this does not loop.

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lockfiles.yml'

permissions:
  contents: read

concurrency:
  group: lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Same-repo branches only: forks get no secrets. Dependabot maintains
    # the lockfiles in its own PRs.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Regenerate lockfiles
        id: regen
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          changed=$(git status --porcelain -- package-lock.json | awk '{print $2}')
          echo "Changed: ${changed:-none}"
          {
            echo 'files<<EOF'
            echo "$changed"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create App token (this repo only)
        if: steps.regen.outputs.files != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit lockfiles (signed by GitHub)
        if: steps.regen.outputs.files != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FILES: ${{ steps.regen.outputs.files }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Lockfiles are far bigger than one argv string may be (128 KiB),
          # so the payload is assembled through files, not arguments.
          tmp="$RUNNER_TEMP/lockfiles"
          mkdir -p "$tmp"
          echo '[]' > "$tmp/additions.json"
          for f in $FILES; do
            base64 -w0 "$f" > "$tmp/blob.b64"
            jq --arg path "$f" --rawfile contents "$tmp/blob.b64" \
              '. + [{path: $path, contents: $contents}]' "$tmp/additions.json" > "$tmp/next.json"
            mv "$tmp/next.json" "$tmp/additions.json"
          done
          jq -n \
            --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
            --slurpfile additions "$tmp/additions.json" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "chore(deps): regenerate lockfiles", body: "Generated by the Lockfiles workflow (Node 24)." },
                fileChanges: { additions: $additions[0] }
              } }
            }' > "$tmp/body.json"
          # expectedHeadOid makes this fail rather than clobber a newer push;
          # that push re-runs this workflow anyway.
          gh api graphql --input "$tmp/body.json" --jq '.data.createCommitOnBranch.commit.url'
