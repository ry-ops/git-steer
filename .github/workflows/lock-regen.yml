name: Lock File Regeneration

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo)'
        required: true
        type: string
      ecosystems:
        description: 'Comma-separated ecosystems to regenerate: uv,npm'
        required: true
        type: string
        default: 'uv,npm'
      subdirs:
        description: 'Comma-separated subdirectories to check (empty = root only)'
        required: false
        type: string
        default: ''

jobs:
  regenerate-locks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Parse target repo
        id: parse
        run: |
          echo "owner=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          echo "repo=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.repo }}

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Setup Python + uv
        if: contains(inputs.ecosystems, 'uv')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: contains(inputs.ecosystems, 'uv')
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Setup Node.js
        if: contains(inputs.ecosystems, 'npm')
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate uv lock files
        if: contains(inputs.ecosystems, 'uv')
        run: |
          SUBDIRS="${{ inputs.subdirs }}"
          DIRS_TO_CHECK="."

          if [ -n "$SUBDIRS" ]; then
            DIRS_TO_CHECK="$SUBDIRS"
          fi

          # Also find all pyproject.toml locations
          FOUND_DIRS=$(find . -name "pyproject.toml" -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \;)
          DIRS_TO_CHECK="$DIRS_TO_CHECK $FOUND_DIRS"

          for dir in $DIRS_TO_CHECK; do
            dir=$(echo "$dir" | sed 's/,/ /g')
            for d in $dir; do
              if [ -f "$d/pyproject.toml" ]; then
                echo "Regenerating uv.lock in $d"
                cd "$d"
                uv lock --upgrade 2>&1 || echo "uv lock failed in $d (non-fatal)"
                cd - > /dev/null
              fi
            done
          done

      - name: Regenerate npm lock files
        if: contains(inputs.ecosystems, 'npm')
        run: |
          SUBDIRS="${{ inputs.subdirs }}"

          # Find all package.json locations
          find . -name "package.json" -not -path "*/node_modules/*" -not -path "*/.git/*" | while read pkg; do
            DIR=$(dirname "$pkg")
            if [ -f "$DIR/package-lock.json" ]; then
              echo "Regenerating package-lock.json in $DIR"
              cd "$DIR"
              rm -f package-lock.json
              npm install --package-lock-only 2>&1 || echo "npm install failed in $DIR (non-fatal)"
              cd - > /dev/null
            elif [ -f "$DIR/yarn.lock" ]; then
              echo "Regenerating yarn.lock in $DIR"
              cd "$DIR"
              rm -f yarn.lock
              npm install --package-lock-only 2>&1 || echo "npm failed, trying yarn" && yarn install 2>&1 || true
              cd - > /dev/null
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No lock file changes detected."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Create branch, commit, and PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="security/regen-locks-$(date +%Y%m%d-%H%M%S)"
          REPO="${{ inputs.target_repo }}"

          git config user.name "git-steer[bot]"
          git config user.email "git-steer[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix(security): regenerate lock files to resolve transitive CVEs"
          git push -u origin "$BRANCH"

          # Create labels (best effort)
          gh label create "security" --color "d73a4a" --repo "$REPO" 2>/dev/null || true
          gh label create "dependencies" --color "0075ca" --repo "$REPO" 2>/dev/null || true
          gh label create "automated" --color "bfd4f2" --repo "$REPO" 2>/dev/null || true

          # Count lock files changed
          LOCKS_CHANGED=$(git diff --name-only HEAD~1 | grep -c "lock\|Lock" || echo "0")

          # Build the PR body in a temp file (properly indented within this
          # run block) — an inline multi-line --body string dedents out of the
          # YAML block scalar and makes the whole workflow unparseable.
          {
            echo "## Lock File Regeneration"
            echo ""
            echo "Regenerates lock files to pull patched versions of transitive dependencies."
            echo ""
            echo "### What changed"
            echo '```'
            git diff --stat HEAD~1
            echo '```'
            echo ""
            echo "### Ecosystems"
            echo "- Regenerated: ${{ inputs.ecosystems }}"
            echo ""
            echo "---"
            echo "Generated by git-steer lock-regen workflow"
          } > /tmp/pr_body.md
          PR_URL=$(gh pr create \
            --title "fix(security): regenerate lock files ($LOCKS_CHANGED files)" \
            --body-file /tmp/pr_body.md \
            --head "$BRANCH" \
            --label "security,dependencies,automated" \
            --repo "$REPO")

          echo "PR created: $PR_URL"

          # Auto-merge
          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          sleep 3
          MERGE_RESP=$(gh api "repos/$REPO/pulls/$PR_NUM/merge" \
            -X PUT \
            -f merge_method=squash \
            -f commit_title="fix(security): regenerate lock files" \
            -f commit_message="Auto-merged by git-steer lock-regen workflow." 2>&1)
          echo "$MERGE_RESP"

      - name: No changes summary
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "Lock files are already up to date - no security fixes available via regeneration."
