name: Security Sweep Worker

on:
  workflow_dispatch:
    inputs:
      target_repos:
        description: 'JSON array [{owner, repo, issueNumber, vulnerabilities}]'
        required: true
        type: string
      severity:
        description: 'Minimum severity level'
        required: false
        default: 'critical'
        type: choice
        options:
          - critical
          - high
          - medium
          - low
          - all
      job_id:
        description: 'Job ID for tracking'
        required: false
        type: string
      dry_run:
        description: 'Preview only, no changes'
        required: false
        default: false
        type: boolean

jobs:
  sweep-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.target_repos) }}

    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          owner: ${{ matrix.target.owner }}
          repositories: ${{ matrix.target.repo }}

      - name: Checkout target repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ matrix.target.owner }}/${{ matrix.target.repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          cache: false

      - name: Detect ecosystem
        id: ecosystem
        run: |
          ECOSYSTEMS=""
          [ -f "package.json" ] && ECOSYSTEMS="${ECOSYSTEMS},npm"
          { [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; } && ECOSYSTEMS="${ECOSYSTEMS},pip"
          [ -f "go.mod" ] && ECOSYSTEMS="${ECOSYSTEMS},go"
          echo "detected=${ECOSYSTEMS#,}" >> $GITHUB_OUTPUT

      - name: Get Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ matrix.target.owner }}/${{ matrix.target.repo }}"
          ALERTS=$(gh api "repos/$REPO/dependabot/alerts" \
            --jq '[.[] | select(.state == "open") | {
              package: .dependency.package.name,
              ecosystem: .dependency.package.ecosystem,
              severity: .security_advisory.severity,
              fix_version: .security_vulnerability.first_patched_version.identifier,
              manifest: .dependency.manifest_path,
              cve: .security_advisory.cve_id,
              summary: .security_advisory.summary
            }]' 2>/dev/null || echo '[]')
          echo "alerts<<EOF" >> $GITHUB_OUTPUT
          echo "$ALERTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(echo "$ALERTS" | jq length)" >> $GITHUB_OUTPUT

      - name: Filter by severity
        id: filter
        env:
          ALERTS_JSON: ${{ steps.alerts.outputs.alerts }}
        run: |
          SEVERITY="${{ inputs.severity }}"
          case $SEVERITY in
            critical) PATTERN='critical' ;;
            high)     PATTERN='critical|high' ;;
            medium)   PATTERN='critical|high|medium' ;;
            low)      PATTERN='critical|high|medium|low' ;;
            all)      PATTERN='.*' ;;
          esac
          FILTERED=$(echo "$ALERTS_JSON" | jq --arg pat "$PATTERN" '[.[] | select(.severity | test($pat))]')
          FIXABLE=$(echo "$FILTERED" | jq '[.[] | select(.fix_version != null)]')
          echo "filtered<<EOF" >> $GITHUB_OUTPUT
          echo "$FIXABLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          COUNT=$(echo "$FIXABLE" | jq length)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Fix npm dependencies
        if: steps.filter.outputs.count != '0' && contains(steps.ecosystem.outputs.detected, 'npm')
        env:
          FILTERED_JSON: ${{ steps.filter.outputs.filtered }}
        run: |
          find . -name "package.json" -not -path "*/node_modules/*" | while read pkg; do
            DIR=$(dirname "$pkg")
            MANIFEST_ALERTS=$(echo "$FILTERED_JSON" | jq --arg m "$pkg" '[.[] | select(.manifest == $m or .ecosystem == "npm")]')
            if [ "$(echo "$MANIFEST_ALERTS" | jq length)" -gt 0 ]; then
              cd "$DIR" && rm -f package-lock.json
              npm install --package-lock-only 2>/dev/null || true
              npm audit fix 2>/dev/null || true
              cd - > /dev/null
            fi
          done

      - name: Fix Python dependencies
        if: steps.filter.outputs.count != '0' && contains(steps.ecosystem.outputs.detected, 'pip')
        env:
          FILTERED_JSON: ${{ steps.filter.outputs.filtered }}
        run: |
          find . -name "requirements*.txt" -type f | while read req; do
            PY_ALERTS=$(echo "$FILTERED_JSON" | jq '[.[] | select(.ecosystem == "pip")]')
            if [ "$(echo "$PY_ALERTS" | jq length)" -gt 0 ]; then
              echo "$PY_ALERTS" | jq -r '.[] | "\(.package) \(.fix_version)"' | while read PKG VER; do
                [ -n "$VER" ] && [ "$VER" != "null" ] && sed -i "s/^${PKG}[=<>!~].*/${PKG}>=${VER}/" "$req" 2>/dev/null || true
              done
            fi
          done
          find . -name "pyproject.toml" -type f | while read toml; do
            DIR=$(dirname "$toml")
            [ -f "$DIR/uv.lock" ] && cd "$DIR" && rm -f uv.lock && uv lock 2>/dev/null || true && cd - > /dev/null
          done

      - name: Fix Go dependencies
        if: steps.filter.outputs.count != '0' && contains(steps.ecosystem.outputs.detected, 'go')
        env:
          FILTERED_JSON: ${{ steps.filter.outputs.filtered }}
        run: |
          GO_ALERTS=$(echo "$FILTERED_JSON" | jq '[.[] | select(.ecosystem == "gomod" or .ecosystem == "go")]')
          if [ "$(echo "$GO_ALERTS" | jq length)" -gt 0 ]; then
            echo "$GO_ALERTS" | jq -r '.[] | "\(.package)@v\(.fix_version)"' | while read MOD; do
              [[ "$MOD" != *"null"* ]] && go get "$MOD" 2>/dev/null || true
            done
            go mod tidy 2>/dev/null || true
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Create branch and commit
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: commit
        env:
          FILTERED_JSON: ${{ steps.filter.outputs.filtered }}
        run: |
          BRANCH="security/sweep-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git config user.name "git-steer[bot]"
          git config user.email "git-steer[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          PACKAGES=$(echo "$FILTERED_JSON" | jq -r '[.[].package] | unique | join(", ")')
          git add -A
          git commit -m "fix(security): patch ${{ steps.filter.outputs.count }} vulns ($PACKAGES)"
          git push -u origin "$BRANCH"

      - name: Ensure labels
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ matrix.target.owner }}/${{ matrix.target.repo }}"
          gh label create "security"     --color "d73a4a" --repo "$REPO" 2>/dev/null || true
          gh label create "dependencies" --color "0075ca" --repo "$REPO" 2>/dev/null || true
          gh label create "automated"    --color "bfd4f2" --repo "$REPO" 2>/dev/null || true
          SEVERITY="${{ inputs.severity }}"
          case $SEVERITY in critical) C="b60205";; high) C="ff9800";; medium) C="fbca04";; *) C="0e8a16";; esac
          gh label create "severity:$SEVERITY" --color "$C" --repo "$REPO" 2>/dev/null || true

      - name: Build PR body
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: body
        run: |
          python3 - << 'PYEOF'
          import json, os

          alerts = json.loads(os.environ.get("ALERTS", "[]"))
          count = len(alerts)
          issue_num = int(os.environ.get("ISSUE_NUM", "0") or 0)

          rows = "\n".join(
              f"| {a.get('cve') or 'N/A'} | {a['package']} | {a['severity'].upper()} | {a.get('fix_version') or 'N/A'} |"
              for a in alerts
          )
          by_sev = {s: sum(1 for a in alerts if a["severity"] == s) for s in ["critical","high","medium","low"]}
          close_line = f"Closes #{issue_num}" if issue_num > 0 else ""

          body = f"""## Security Sweep Fix

          This PR addresses **{count}** security vulnerabilities.

          {close_line}

          ### Vulnerabilities Fixed

          | CVE | Package | Severity | Fix Version |
          |-----|---------|----------|-------------|
          {rows}

          ### Summary
          Critical: {by_sev['critical']}  High: {by_sev['high']}  Medium: {by_sev['medium']}  Low: {by_sev['low']}

          ---
          Generated by [git-steer](https://github.com/ry-ops/git-steer) autonomous security sweep"""

          with open("/tmp/pr_body.md", "w") as f:
              f.write(body)
          print("PR body written.")
          PYEOF
        env:
          ALERTS: ${{ steps.filter.outputs.filtered }}
          ISSUE_NUM: ${{ matrix.target.issueNumber }}

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ matrix.target.owner }}/${{ matrix.target.repo }}"
          PR_URL=$(gh pr create \
            --title "fix(security): Patch ${{ steps.filter.outputs.count }} ${{ inputs.severity }}+ vulnerabilities" \
            --body-file /tmp/pr_body.md \
            --head "${{ steps.commit.outputs.branch }}" \
            --label "security,dependencies,automated,severity:${{ inputs.severity }}" \
            --repo "$REPO")
          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "number=$(echo "$PR_URL" | grep -oE '[0-9]+$')" >> $GITHUB_OUTPUT

      - name: Comment on RFC issue
        if: steps.pr.outputs.url != '' && inputs.dry_run == false && matrix.target.issueNumber != 0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ matrix.target.owner }}/${{ matrix.target.repo }}"
          gh api "repos/$REPO/issues/${{ matrix.target.issueNumber }}/comments" \
            -f body="Fix PR created: ${{ steps.pr.outputs.url }} — awaiting auto-merge and verification."

      - name: Enable auto-merge
        if: steps.pr.outputs.number != '' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --auto --squash \
            --repo "${{ matrix.target.owner }}/${{ matrix.target.repo }}" \
            --subject "fix(security): Patch ${{ steps.filter.outputs.count }} ${{ inputs.severity }}+ vulnerabilities" \
            --body "Auto-merged by git-steer."

      - name: Wait for PR to merge
        if: steps.pr.outputs.number != '' && inputs.dry_run == false
        id: wait-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          REPO="${{ matrix.target.owner }}/${{ matrix.target.repo }}"
          for i in $(seq 1 24); do
            PR_JSON=$(gh pr view "$PR_NUM" --repo "$REPO" --json state,mergedAt)
            STATE=$(echo "$PR_JSON" | jq -r '.state')
            MERGED_AT=$(echo "$PR_JSON" | jq -r '.mergedAt')
            echo "Poll $i state=$STATE mergedAt=$MERGED_AT"
            if [ "$MERGED_AT" != "null" ] && [ -n "$MERGED_AT" ]; then echo "merged=true" >> $GITHUB_OUTPUT; break; fi
            if [ "$STATE" = "CLOSED" ]; then echo "merged=false" >> $GITHUB_OUTPUT; break; fi
            sleep 15
          done
          grep -q "merged=" $GITHUB_OUTPUT || echo "merged=pending" >> $GITHUB_OUTPUT

      - name: Verify fixes applied
        if: steps.wait-merge.outputs.merged == 'true'
        id: verify
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ matrix.target.owner }}/${{ matrix.target.repo }}"
          echo "Waiting 30s for Dependabot..."
          sleep 30
          REMAINING=$(gh api "repos/$REPO/dependabot/alerts" \
            --jq '[.[] | select(.state == "open")] | length' 2>/dev/null || echo "unknown")
          echo "remaining_alerts=$REMAINING" >> $GITHUB_OUTPUT
          if [ "$REMAINING" = "0" ]; then
            echo "result=all_clear" >> $GITHUB_OUTPUT
            echo "Verification passed - no open alerts remaining."
          else
            echo "result=partial" >> $GITHUB_OUTPUT
            echo "Verification: $REMAINING alert(s) still open."
          fi

      - name: Comment verification result on RFC
        if: steps.wait-merge.outputs.merged == 'true' && matrix.target.issueNumber != 0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ matrix.target.owner }}/${{ matrix.target.repo }}"
          RESULT="${{ steps.verify.outputs.result }}"
          REMAINING="${{ steps.verify.outputs.remaining_alerts }}"
          if [ "$RESULT" = "all_clear" ]; then
            gh api "repos/$REPO/issues/${{ matrix.target.issueNumber }}/comments" \
              -f body="Verification passed - all alerts resolved. Closing RFC."
            gh issue close "${{ matrix.target.issueNumber }}" --repo "$REPO" 2>/dev/null || true
          else
            gh api "repos/$REPO/issues/${{ matrix.target.issueNumber }}/comments" \
              -f body="Verification partial - $REMAINING alert(s) still open after merge."
          fi

      - name: Update rfcs.jsonl in state repo
        if: steps.pr.outputs.number != '' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ matrix.target.owner }}/${{ matrix.target.repo }}"
          ISSUE_NUM="${{ matrix.target.issueNumber }}"
          MERGED="${{ steps.wait-merge.outputs.merged || 'pending' }}"
          VERIFY="${{ steps.verify.outputs.result || 'pending' }}"
          REMAINING="${{ steps.verify.outputs.remaining_alerts || 'unknown' }}"
          STATE_REPO="ry-ops/git-steer-state"
          [ "$VERIFY" = "all_clear" ] && RFC_STATUS="fixed" || RFC_STATUS="in_progress"

          RFCS_CONTENT=$(gh api "repos/$STATE_REPO/contents/state/rfcs.jsonl" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")
          RFCS_SHA=$(gh api "repos/$STATE_REPO/contents/state/rfcs.jsonl" --jq '.sha' 2>/dev/null || echo "")

          if [ -n "$RFCS_CONTENT" ]; then
            UPDATED=$(echo "$RFCS_CONTENT" | while IFS= read -r line; do
              if echo "$line" | jq -e --arg r "$REPO" --argjson i "${ISSUE_NUM:-0}" \
                'select(.repo == $r and .issueNumber == $i)' >/dev/null 2>&1; then
                echo "$line" | jq -c \
                  --arg pn "${{ steps.pr.outputs.number }}" \
                  --arg pu "${{ steps.pr.outputs.url }}" \
                  --arg status "$RFC_STATUS" \
                  --arg merged "$MERGED" \
                  --arg verify "$VERIFY" \
                  --arg remaining "$REMAINING" \
                  '. + {prNumber:($pn|tonumber),prUrl:$pu,status:$status,merged:$merged,verifyResult:$verify,remainingAlerts:$remaining}'
              else
                echo "$line"
              fi
            done)
            ENCODED=$(echo "$UPDATED" | base64 -w0 2>/dev/null || echo "$UPDATED" | base64)
            gh api "repos/$STATE_REPO/contents/state/rfcs.jsonl" -X PUT \
              -f message="state: update RFC for $REPO verify=$VERIFY" \
              -f content="$ENCODED" -f sha="$RFCS_SHA" 2>/dev/null || true
          fi

      - name: Report results
        if: always() && inputs.job_id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          jq -n \
            --arg id "${{ inputs.job_id }}" \
            --arg status "${{ job.status }}" \
            --arg repo "${{ matrix.target.owner }}/${{ matrix.target.repo }}" \
            --arg severity "${{ inputs.severity }}" \
            --arg fixed "${{ steps.filter.outputs.count || '0' }}" \
            --arg merged "${{ steps.wait-merge.outputs.merged || 'na' }}" \
            --arg verify "${{ steps.verify.outputs.result || 'na' }}" \
            --arg remaining "${{ steps.verify.outputs.remaining_alerts || 'na' }}" \
            --arg pr_url "${{ steps.pr.outputs.url || '' }}" \
            --arg pr_number "${{ steps.pr.outputs.number || '' }}" \
            --arg issue_number "${{ matrix.target.issueNumber }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{id:$id,status:$status,repo:$repo,severity:$severity,fixed:($fixed|tonumber),merged:$merged,verify:$verify,remaining:$remaining,pr_url:$pr_url,pr_number:$pr_number,issue_number:$issue_number,ts:$ts}'
