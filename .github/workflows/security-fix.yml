name: Security Fix Worker

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo)'
        required: true
        type: string
      severity:
        description: 'Minimum severity to fix'
        required: false
        default: 'critical'
        type: choice
        options:
          - critical
          - high
          - medium
          - low
          - all
      dry_run:
        description: 'Preview only, no changes'
        required: false
        default: false
        type: boolean
      job_id:
        description: 'Job ID for tracking (from git-steer)'
        required: false
        type: string

jobs:
  fix-vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Parse target repo
        id: parse
        run: |
          echo "owner=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          echo "repo=$(echo "${{ inputs.target_repo }}" | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GIT_STEER_APP_ID }}
          private-key: ${{ secrets.GIT_STEER_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.repo }}

      - name: Checkout target repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Get Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ALERTS=$(gh api "repos/${{ inputs.target_repo }}/dependabot/alerts" \
            --jq '[.[] | select(.state == "open") | {
              package: .dependency.package.name,
              ecosystem: .dependency.package.ecosystem,
              severity: .security_advisory.severity,
              fix_version: .security_vulnerability.first_patched_version.identifier,
              manifest: .dependency.manifest_path,
              cve: .security_advisory.cve_id,
              summary: .security_advisory.summary
            }]')

          echo "alerts<<EOF" >> $GITHUB_OUTPUT
          echo "$ALERTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          COUNT=$(echo "$ALERTS" | jq 'length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Filter by severity
        id: filter
        env:
          ALERTS: ${{ steps.alerts.outputs.alerts }}
        run: |
          SEVERITY="${{ inputs.severity }}"

          case $SEVERITY in
            critical) PATTERN='critical' ;;
            high) PATTERN='critical|high' ;;
            medium) PATTERN='critical|high|medium' ;;
            low) PATTERN='critical|high|medium|low' ;;
            all) PATTERN='.*' ;;
          esac

          FILTERED=$(echo "$ALERTS" | jq --arg pat "$PATTERN" '[.[] | select(.severity | test($pat))]')
          FIXABLE=$(echo "$FILTERED" | jq '[.[] | select(.fix_version != null)]')

          echo "filtered<<EOF" >> $GITHUB_OUTPUT
          echo "$FIXABLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          COUNT=$(echo "$FIXABLE" | jq 'length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Check if fixes needed
        if: steps.filter.outputs.count == '0'
        run: |
          echo "No fixable vulnerabilities found at ${{ inputs.severity }}+ severity"
          exit 0

      - name: Fix npm dependencies
        if: steps.filter.outputs.count != '0'
        env:
          ALERTS: ${{ steps.filter.outputs.filtered }}
        run: |
          find . -name "package.json" -not -path "*/node_modules/*" | while read pkg; do
            DIR=$(dirname "$pkg")
            echo "Processing $pkg..."

            MANIFEST_ALERTS=$(echo "$ALERTS" | jq --arg m "$pkg" '[.[] | select(.manifest == $m or .ecosystem == "npm")]')

            if [ "$(echo "$MANIFEST_ALERTS" | jq 'length')" -gt 0 ]; then
              cd "$DIR"

              if [ -f "package-lock.json" ]; then
                rm package-lock.json
                npm install --package-lock-only 2>/dev/null || true
              fi

              npm audit fix 2>/dev/null || true

              cd - > /dev/null
            fi
          done

      - name: Fix Python dependencies
        if: steps.filter.outputs.count != '0'
        env:
          ALERTS: ${{ steps.filter.outputs.filtered }}
        run: |
          find . -name "requirements*.txt" -type f | while read req; do
            echo "Processing $req..."

            PY_ALERTS=$(echo "$ALERTS" | jq '[.[] | select(.ecosystem == "pip")]')

            if [ "$(echo "$PY_ALERTS" | jq 'length')" -gt 0 ]; then
              echo "$PY_ALERTS" | jq -r '.[] | "\(.package) \(.fix_version)"' | while read PKG VER; do
                if [ -n "$VER" ] && [ "$VER" != "null" ]; then
                  sed -i "s/^${PKG}[=<>!~].*/${PKG}>=${VER}/I" "$req" 2>/dev/null || true
                  sed -i "s/^${PKG}$/${PKG}>=${VER}/I" "$req" 2>/dev/null || true
                fi
              done
            fi
          done

          find . -name "pyproject.toml" -type f | while read toml; do
            DIR=$(dirname "$toml")
            if [ -f "$DIR/uv.lock" ]; then
              echo "Regenerating uv.lock in $DIR..."
              cd "$DIR"
              rm -f uv.lock
              uv lock 2>/dev/null || true
              cd - > /dev/null
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Create branch and commit
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        run: |
          BRANCH="security/fix-${{ inputs.severity }}-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_ENV

          git config user.name "git-steer[bot]"
          git config user.email "git-steer[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          PACKAGES=$(echo '${{ steps.filter.outputs.filtered }}' | jq -r '[.[].package] | unique | join(", ")')
          CVES=$(echo '${{ steps.filter.outputs.filtered }}' | jq -r '[.[].cve // empty] | unique | join(", ")')

          git add -A
          git commit -m "fix(security): patch ${{ steps.filter.outputs.count }} vulnerabilities

Updates packages: $PACKAGES
CVEs: $CVES

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"

          git push -u origin "$BRANCH"

      - name: Ensure labels exist
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ steps.parse.outputs.owner }}/${{ steps.parse.outputs.repo }}"
          gh label create "security" --color "d73a4a" --description "Security vulnerability" --repo "$REPO" 2>/dev/null || true
          gh label create "dependencies" --color "0075ca" --description "Dependency updates" --repo "$REPO" 2>/dev/null || true
          gh label create "automated" --color "bfd4f2" --description "Created by automation" --repo "$REPO" 2>/dev/null || true

          SEVERITY="${{ inputs.severity }}"
          case $SEVERITY in
            critical) COLOR="b60205" ;;
            high) COLOR="ff9800" ;;
            medium) COLOR="fbca04" ;;
            *) COLOR="0e8a16" ;;
          esac
          gh label create "severity:$SEVERITY" --color "$COLOR" --description "$SEVERITY severity" --repo "$REPO" 2>/dev/null || true

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          COUNT=${{ steps.filter.outputs.count }}

          BODY=$(cat <<PREOF
## Security Fix

This PR addresses **$COUNT** security vulnerabilities.

### Vulnerabilities Fixed

| CVE | Package | Severity | Fix Version |
|-----|---------|----------|-------------|
$(echo '${{ steps.filter.outputs.filtered }}' | jq -r '.[] | "| \(.cve // "N/A") | \(.package) | \(.severity | ascii_upcase) | \(.fix_version // "N/A") |"')

### Summary
- **Critical:** $(echo '${{ steps.filter.outputs.filtered }}' | jq '[.[] | select(.severity == "critical")] | length')
- **High:** $(echo '${{ steps.filter.outputs.filtered }}' | jq '[.[] | select(.severity == "high")] | length')
- **Medium:** $(echo '${{ steps.filter.outputs.filtered }}' | jq '[.[] | select(.severity == "medium")] | length')
- **Low:** $(echo '${{ steps.filter.outputs.filtered }}' | jq '[.[] | select(.severity == "low")] | length')

---

Generated by [git-steer](https://github.com/ry-ops/git-steer) GitHub Actions worker
PREOF
          )

          PR_URL=$(gh pr create \
            --title "fix(security): Patch $COUNT ${{ inputs.severity }}+ vulnerabilities" \
            --body "$BODY" \
            --head "$branch" \
            --label "security" \
            --label "dependencies" \
            --label "automated" \
            --label "severity:${{ inputs.severity }}" \
            --repo "${{ inputs.target_repo }}")

          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "number=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Enable auto-merge
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --auto \
            --squash \
            --repo "${{ inputs.target_repo }}" \
            --subject "fix(security): Patch ${{ steps.filter.outputs.count }} ${{ inputs.severity }}+ vulnerabilities" \
            --body "Auto-merged by git-steer after security fix workflow."
          echo "Auto-merge enabled on PR #${{ steps.pr.outputs.number }}"

      - name: Wait for PR to merge
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == false && steps.pr.outputs.number != ''
        id: wait-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          REPO="${{ inputs.target_repo }}"
          echo "Waiting for PR #$PR_NUM to merge..."

          for i in $(seq 1 24); do
            STATE=$(gh pr view "$PR_NUM" --repo "$REPO" --json state,merged -q '.state + ":" + (.merged | tostring)')
            MERGED=$(echo "$STATE" | cut -d: -f2)
            PR_STATE=$(echo "$STATE" | cut -d: -f1)

            echo "Attempt $i — state: $PR_STATE, merged: $MERGED"

            if [ "$MERGED" = "true" ]; then
              echo "merged=true" >> $GITHUB_OUTPUT
              echo "PR #$PR_NUM merged successfully."
              break
            fi

            if [ "$PR_STATE" = "CLOSED" ] && [ "$MERGED" != "true" ]; then
              echo "merged=false" >> $GITHUB_OUTPUT
              echo "PR #$PR_NUM was closed without merging."
              break
            fi

            sleep 15
          done

          # If we exhausted retries without merge, mark as pending
          if [ -z "$(grep 'merged=' $GITHUB_OUTPUT)" ]; then
            echo "merged=pending" >> $GITHUB_OUTPUT
            echo "PR #$PR_NUM did not merge within timeout — may need manual checks to pass."
          fi

      - name: Verify fixes applied
        if: steps.wait-merge.outputs.merged == 'true'
        id: verify
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ inputs.target_repo }}"
          SEVERITY="${{ inputs.severity }}"

          echo "Waiting 30s for Dependabot to process the merge..."
          sleep 30

          # Re-fetch open alerts after merge
          REMAINING=$(gh api "repos/$REPO/dependabot/alerts" \
            --jq '[.[] | select(.state == "open")] | length' 2>/dev/null || echo "unknown")

          FIXED_ALERTS=$(echo '${{ steps.filter.outputs.filtered }}' | jq -r '[.[].cve // .[].package] | join(", ")')

          echo "remaining_alerts=$REMAINING" >> $GITHUB_OUTPUT

          if [ "$REMAINING" = "0" ]; then
            echo "result=all_clear" >> $GITHUB_OUTPUT
            echo "✅ Verification passed — no open Dependabot alerts remaining."
          else
            echo "result=partial" >> $GITHUB_OUTPUT
            echo "⚠️  Verification: $REMAINING alert(s) still open after merge."
          fi

          echo "Fixed: $FIXED_ALERTS"
          echo "Remaining open alerts: $REMAINING"

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          echo "## Dry Run Summary"
          echo ""
          echo "Would fix ${{ steps.filter.outputs.count }} vulnerabilities:"
          echo '${{ steps.filter.outputs.filtered }}' | jq -r '.[] | "- \(.package) (\(.severity)): \(.cve // "N/A")"'
          echo ""
          echo "Changes that would be made:"
          git diff --stat || echo "No file changes detected"

      - name: Report status to git-steer-state
        if: always() && inputs.job_id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STATUS="${{ job.status }}"
          JOB_ID="${{ inputs.job_id }}"
          FIXED_COUNT="${{ steps.filter.outputs.count }}"
          FIXED_COUNT="${FIXED_COUNT:-0}"
          MERGED="${{ steps.wait-merge.outputs.merged || 'n/a' }}"
          VERIFY_RESULT="${{ steps.verify.outputs.result || 'n/a' }}"
          REMAINING="${{ steps.verify.outputs.remaining_alerts || 'n/a' }}"

          ENTRY=$(jq -n \
            --arg id "$JOB_ID" \
            --arg status "$STATUS" \
            --arg repo "${{ inputs.target_repo }}" \
            --arg severity "${{ inputs.severity }}" \
            --arg fixed "$FIXED_COUNT" \
            --arg merged "$MERGED" \
            --arg verify "$VERIFY_RESULT" \
            --arg remaining "$REMAINING" \
            --arg pr_url "${{ steps.pr.outputs.url || '' }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{id: $id, status: $status, repo: $repo, severity: $severity, fixed: ($fixed | tonumber), merged: $merged, verify: $verify, remaining_alerts: $remaining, pr_url: $pr_url, timestamp: $timestamp}')

          echo "Job result: $ENTRY"
