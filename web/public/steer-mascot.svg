<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      @keyframes breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes earTwitch {
        0%, 90%, 100% { transform: rotate(0deg); }
        93% { transform: rotate(-8deg); }
        96% { transform: rotate(2deg); }
      }
      @keyframes tailSwish {
        0%, 80%, 100% { transform: rotate(0deg); }
        85% { transform: rotate(12deg); }
        90% { transform: rotate(-8deg); }
        95% { transform: rotate(5deg); }
      }
      @keyframes blink {
        0%, 92%, 96%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.05); }
      }
      .body-group { animation: breathe 3s ease-in-out infinite; }
      .ear-left { animation: earTwitch 4s ease-in-out infinite; transform-origin: 145px 135px; }
      .tail-group { animation: tailSwish 5s ease-in-out infinite; transform-origin: 290px 280px; }
      .eye-left, .eye-right { animation: blink 6s ease-in-out infinite; }
      .eye-left { transform-origin: 170px 188px; }
      .eye-right { transform-origin: 230px 188px; }
    </style>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#ddd8be" />
      <stop offset="60%" style="stop-color:#c4b896" />
      <stop offset="100%" style="stop-color:#b5a882" />
    </linearGradient>
    <linearGradient id="hornGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" style="stop-color:#e8d5b0" />
      <stop offset="100%" style="stop-color:#f5e6c8" />
    </linearGradient>
    <linearGradient id="snoutGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#c4b896" />
      <stop offset="100%" style="stop-color:#b09e7a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#3a9956" />
      <stop offset="100%" style="stop-color:#2d7d46" />
    </linearGradient>
  </defs>

  <g class="body-group">
    <!-- Body / torso area -->
    <ellipse cx="200" cy="290" rx="105" ry="80" fill="url(#bodyGrad)" stroke="#4a3f2f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M160,230 Q160,260 165,280 L235,280 Q240,260 240,230" fill="url(#bodyGrad)" stroke="#4a3f2f" stroke-width="2.5"/>

    <!-- Head -->
    <ellipse cx="200" cy="185" rx="68" ry="60" fill="url(#bodyGrad)" stroke="#4a3f2f" stroke-width="2.5"/>

    <!-- Forehead tuft of fur -->
    <path d="M185,128 Q190,118 195,127 Q198,115 203,126 Q207,117 210,128" fill="#c4b896" stroke="#4a3f2f" stroke-width="1.5" stroke-linecap="round" fill-opacity="0.8"/>

    <!-- Left horn -->
    <path d="M148,148 Q120,110 108,75 Q105,65 112,68 Q125,78 140,138" fill="url(#hornGrad)" stroke="#4a3f2f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Horn ridges -->
    <path d="M135,120 Q128,115 132,110" fill="none" stroke="#e0cfa5" stroke-width="1.2" opacity="0.6"/>
    <path d="M140,105 Q133,100 136,95" fill="none" stroke="#e0cfa5" stroke-width="1.2" opacity="0.6"/>

    <!-- Right horn -->
    <path d="M252,148 Q280,110 292,75 Q295,65 288,68 Q275,78 260,138" fill="url(#hornGrad)" stroke="#4a3f2f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Horn ridges -->
    <path d="M265,120 Q272,115 268,110" fill="none" stroke="#e0cfa5" stroke-width="1.2" opacity="0.6"/>
    <path d="M260,105 Q267,100 264,95" fill="none" stroke="#e0cfa5" stroke-width="1.2" opacity="0.6"/>

    <!-- Left ear -->
    <g class="ear-left">
      <path d="M138,148 Q115,135 108,145 Q105,155 132,158" fill="#c4b896" stroke="#4a3f2f" stroke-width="2" stroke-linecap="round"/>
      <path d="M130,148 Q120,142 117,148" fill="#b09e7a" stroke="none" opacity="0.5"/>
    </g>

    <!-- Right ear -->
    <path d="M262,148 Q285,135 292,145 Q295,155 268,158" fill="#c4b896" stroke="#4a3f2f" stroke-width="2" stroke-linecap="round"/>
    <path d="M270,148 Q280,142 283,148" fill="#b09e7a" stroke="none" opacity="0.5"/>

    <!-- Eyes -->
    <g class="eye-left">
      <ellipse cx="170" cy="188" rx="12" ry="13" fill="white" stroke="#4a3f2f" stroke-width="1.8"/>
      <ellipse cx="172" cy="189" rx="7" ry="8" fill="#233747"/>
      <circle cx="175" cy="185" r="2.5" fill="white" opacity="0.85"/>
    </g>
    <g class="eye-right">
      <ellipse cx="230" cy="188" rx="12" ry="13" fill="white" stroke="#4a3f2f" stroke-width="1.8"/>
      <ellipse cx="228" cy="189" rx="7" ry="8" fill="#233747"/>
      <circle cx="231" cy="185" r="2.5" fill="white" opacity="0.85"/>
    </g>

    <!-- Eyebrows — friendly arch -->
    <path d="M156,172 Q165,166 180,170" fill="none" stroke="#4a3f2f" stroke-width="2" stroke-linecap="round"/>
    <path d="M244,172 Q235,166 220,170" fill="none" stroke="#4a3f2f" stroke-width="2" stroke-linecap="round"/>

    <!-- Snout -->
    <ellipse cx="200" cy="215" rx="32" ry="22" fill="url(#snoutGrad)" stroke="#4a3f2f" stroke-width="2"/>

    <!-- Nostrils -->
    <ellipse cx="188" cy="215" rx="5" ry="4" fill="#8b7355" opacity="0.7"/>
    <ellipse cx="212" cy="215" rx="5" ry="4" fill="#8b7355" opacity="0.7"/>

    <!-- Nose ring -->
    <circle cx="200" cy="225" r="8" fill="none" stroke="#b8a080" stroke-width="2.5"/>
    <circle cx="200" cy="225" r="8" fill="none" stroke="#cdb896" stroke-width="1.5" stroke-dasharray="1 3" opacity="0.4"/>

    <!-- Smile -->
    <path d="M185,230 Q200,240 215,230" fill="none" stroke="#4a3f2f" stroke-width="2" stroke-linecap="round"/>

    <!-- Cheek blush -->
    <ellipse cx="152" cy="205" rx="10" ry="6" fill="#d4a08a" opacity="0.3"/>
    <ellipse cx="248" cy="205" rx="10" ry="6" fill="#d4a08a" opacity="0.3"/>

    <!-- Small green shield on chest -->
    <g transform="translate(200,310)">
      <path d="M0,-18 L14,-10 L14,4 Q14,16 0,22 Q-14,16 -14,4 L-14,-10 Z" fill="url(#shieldGrad)" stroke="#1e5c32" stroke-width="1.5" opacity="0.9"/>
      <!-- Lock icon on shield -->
      <rect x="-4" y="0" width="8" height="7" rx="1" fill="#e8f5e8" opacity="0.9"/>
      <path d="M-3,0 Q-3,-6 0,-7 Q3,-6 3,0" fill="none" stroke="#e8f5e8" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
      <circle cx="0" cy="4" r="1.2" fill="#2d7d46"/>
    </g>

    <!-- Tail -->
    <g class="tail-group">
      <path d="M290,275 Q310,260 318,245 Q322,238 315,242 Q308,250 300,270" fill="none" stroke="#8b7355" stroke-width="3" stroke-linecap="round"/>
      <!-- Tail tuft -->
      <path d="M315,242 Q325,235 320,230 Q315,232 318,240" fill="#8b7355" stroke="#4a3f2f" stroke-width="1"/>
    </g>

    <!-- Sketchy texture lines on body for hand-drawn feel -->
    <path d="M130,290 Q140,285 150,290" fill="none" stroke="#b5a882" stroke-width="0.8" opacity="0.4"/>
    <path d="M240,285 Q250,280 260,286" fill="none" stroke="#b5a882" stroke-width="0.8" opacity="0.4"/>
    <path d="M170,310 Q185,305 200,308" fill="none" stroke="#b5a882" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>