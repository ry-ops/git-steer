  <text x="84" y="385" font-size="13" class="mono">repo-08</text>
  <text class="n7" x="170" y="385" font-size="12" style="fill:#9ff0c4">✅ applied · checked</text>
  <rect x="58" y="399" width="16" height="16" rx="4" fill="none" stroke="#4a5163" stroke-width="2"/>
  <g class="k8"><rect x="58" y="399" width="16" height="16" rx="4" fill="#238636"/><path d="M61.5 407 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2.2" fill="none"/></g>
  <text x="84" y="412" font-size="13" class="mono">repo-09</text>
  <text class="n8" x="170" y="412" font-size="12" style="fill:#9ff0c4">✅ applied · checked</text>
  <rect x="58" y="426" width="16" height="16" rx="4" fill="none" stroke="#4a5163" stroke-width="2"/>
  <g class="k9"><rect x="58" y="426" width="16" height="16" rx="4" fill="#238636"/><path d="M61.5 434 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2.2" fill="none"/></g>
  <text x="84" y="439" font-size="13" class="mono">repo-10</text>
  <text class="n9" x="170" y="439" font-size="12" style="fill:#9ff0c4">✅ applied · checked</text>
  <text x="54" y="462" font-size="12" class="muted">Failed check → <tspan style="fill:#fbca04">paused</tspan>, with the reason. Close the issue → cancelled.</text>

  <!-- Clock -->
  <g transform="translate(400 300)">
    <circle r="34" fill="#1d2536" stroke="#ffb02e" stroke-width="3"/>
    <text class="h1" y="-2" text-anchor="middle" font-size="15" font-weight="800" style="fill:#ffd88a">hour 1</text>
    <text class="h2" y="-2" text-anchor="middle" font-size="15" font-weight="800" style="fill:#ffd88a">hour 2</text>
    <text class="done" y="-2" text-anchor="middle" font-size="15" font-weight="800" style="fill:#9ff0c4">done</text>
    <text y="16" text-anchor="middle" font-size="11" class="muted">5 per hour</text>
  </g>

  <!-- One job -->
  <text x="530" y="132" font-size="16" font-weight="700">Inside one job</text>
  <text x="530" y="154" font-size="13" class="muted">One repo, one token, one write at most.</text>
  <g transform="translate(530 176)">
    <rect width="400" height="58" rx="12" fill="#1d2536"/>
    <circle cx="30" cy="29" r="9" fill="none" stroke="#ffb02e" stroke-width="3"/><path d="M39 29 h18 m-5 0 v6 m-7 -6 v5" stroke="#ffb02e" stroke-width="3" fill="none"/>
    <text x="70" y="25" font-size="13" font-weight="700">Mint a git-steer-admin token</text>
    <text x="70" y="43" font-size="12" class="muted mono">repositories: repo-04 · admin: write</text>
  </g>
  <g transform="translate(530 262)">
    <line x1="60" y1="40" x2="340" y2="40" stroke="#2c3750" stroke-width="3"/>
    <circle class="flow" cx="60" cy="40" r="6" fill="#3ec7ff"/>
    <circle class="node1" cx="60" cy="40" r="26" fill="#10283a" stroke="#3ec7ff" stroke-width="2"/><text x="60" y="45" text-anchor="middle" font-size="13" font-weight="700">check</text>
    <circle class="node2" cx="200" cy="40" r="26" fill="#2d2512" stroke="#ffb02e" stroke-width="2"/><text x="200" y="45" text-anchor="middle" font-size="13" font-weight="700">apply</text>
    <circle class="node3" cx="340" cy="40" r="26" fill="#123322" stroke="#3ddc84" stroke-width="2"/><text x="340" y="45" text-anchor="middle" font-size="13" font-weight="700">check</text>
    <text x="60" y="92" text-anchor="middle" font-size="12" class="muted">already right?</text><text x="60" y="108" text-anchor="middle" font-size="12" class="muted">skip, no write</text>
    <text x="200" y="92" text-anchor="middle" font-size="12" class="muted">only if needed</text>
    <text x="340" y="92" text-anchor="middle" font-size="12" class="muted">verify, then</text><text x="340" y="108" text-anchor="middle" font-size="12" class="muted">tick the box</text>
  </g>
  <g transform="translate(530 398)">
    <rect width="400" height="62" rx="12" fill="#161d2b" stroke="#2c3750"/>
    <text x="18" y="26" font-size="13" font-weight="700">Never written to:</text>
    <text x="138" y="26" font-size="12" class="muted">repos that are already right,</text>
    <text x="18" y="46" font-size="12" class="muted">features the plan doesn't include, or anything git-steer can't read.</text>
  </g>
</svg>
