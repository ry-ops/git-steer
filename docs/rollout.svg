    @keyframes k9 { 0%,78.69% { opacity: 0; transform: scale(.4); } 80.31%,96.25% { opacity: 1; transform: scale(1); } 98.75%,100% { opacity: 0; } }
    .k9 { animation: k9 16.0s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes n9 { 0%,79.38% { opacity: 0; } 81.25%,96.25% { opacity: 1; } 98.75%,100% { opacity: 0; } }
    .n9 { animation: n9 16.0s infinite; }
    @keyframes h1 { 0%,11.88% { opacity: 0; } 13.75%,50.00% { opacity: 1; } 51.88%,100% { opacity: 0; } } .h1 { animation: h1 16.0s infinite; }
    @keyframes h2 { 0%,51.88% { opacity: 0; } 53.75%,85.62% { opacity: 1; } 87.50%,100% { opacity: 0; } } .h2 { animation: h2 16.0s infinite; }
    @keyframes done { 0%,86.25% { opacity: 0; } 88.13%,97.50% { opacity: 1; } 99.38%,100% { opacity: 0; } } .done { animation: done 16.0s infinite; }
    @keyframes appr { 0%,2.50% { opacity: 0; transform: translateY(-18px); } 6.25%,96.25% { opacity: 1; transform: translateY(0); } 98.75%,100% { opacity: 0; } } .appr { animation: appr 16.0s infinite; }
    @keyframes closed { 0%,87.50% { opacity: 0; } 89.38%,97.50% { opacity: 1; } 99.38%,100% { opacity: 0; } } .closed { animation: closed 16.0s infinite; }
    .flow { animation: flow 2.4s linear infinite; }
    @keyframes flow { 0% { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { transform: translateX(300px); opacity: 0; } }
    .node1 { animation: node 2.4s infinite; } .node2 { animation: node 2.4s .8s infinite; } .node3 { animation: node 2.4s 1.6s infinite; }
    @keyframes node { 0%,100% { stroke-width: 2; } 10%,25% { stroke-width: 5; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
