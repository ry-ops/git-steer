  <rect width="960" height="500" rx="20" fill="#0f1420"/>
  <text x="40" y="52" font-size="28" font-weight="800">Rollouts: change the fleet, one repo at a time</text>
  <text x="40" y="78" font-size="15" class="muted">You start it and approve it. git-steer does the rest, 5 repos an hour, and checks every write.</text>

  <!-- Rollout issue -->
  <rect x="30" y="100" width="460" height="376" rx="14" fill="#161d2b" stroke="#2c3750"/>
  <text x="54" y="132" font-size="16" font-weight="700">Rollout: default-branch-ruleset <tspan class="muted" font-weight="400">(10 targets)</tspan></text>
  <rect x="54" y="144" width="122" height="20" rx="10" fill="#0e3a1f" stroke="#3ddc84"/><text x="115" y="158" text-anchor="middle" font-size="11" font-weight="700" style="fill:#9ff0c4">git-steer-rollout</text>
  <g class="appr"><rect x="184" y="144" width="78" height="20" rx="10" fill="#1d76db"/><text x="223" y="158" text-anchor="middle" font-size="11" font-weight="700">approved</text></g>
  <text x="272" y="158" font-size="11" class="muted">← added by you</text>
  <g class="closed"><rect x="388" y="112" width="84" height="22" rx="11" fill="#8957e5"/><text x="430" y="127" text-anchor="middle" font-size="12" font-weight="700">✓ Closed</text></g>
  <rect x="58" y="183" width="16" height="16" rx="4" fill="none" stroke="#4a5163" stroke-width="2"/>
  <g class="k0"><rect x="58" y="183" width="16" height="16" rx="4" fill="#238636"/><path d="M61.5 191 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2.2" fill="none"/></g>
  <text x="84" y="196" font-size="13" class="mono">repo-01</text>
  <text class="n0" x="170" y="196" font-size="12" style="fill:#9ff0c4">✅ applied · checked</text>
  <rect x="58" y="210" width="16" height="16" rx="4" fill="none" stroke="#4a5163" stroke-width="2"/>
  <g class="k1"><rect x="58" y="210" width="16" height="16" rx="4" fill="#238636"/><path d="M61.5 218 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2.2" fill="none"/></g>
  <text x="84" y="223" font-size="13" class="mono">repo-02</text>
  <text class="n1" x="170" y="223" font-size="12" style="fill:#9ff0c4">✅ applied · checked</text>
  <rect x="58" y="237" width="16" height="16" rx="4" fill="none" stroke="#4a5163" stroke-width="2"/>
  <g class="k2"><rect x="58" y="237" width="16" height="16" rx="4" fill="#238636"/><path d="M61.5 245 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2.2" fill="none"/></g>
  <text x="84" y="250" font-size="13" class="mono">repo-03</text>
  <text class="n2" x="170" y="250" font-size="12" style="fill:#9ff0c4">✅ applied · checked</text>
  <rect x="58" y="264" width="16" height="16" rx="4" fill="none" stroke="#4a5163" stroke-width="2"/>
  <g class="k3"><rect x="58" y="264" width="16" height="16" rx="4" fill="#238636"/><path d="M61.5 272 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2.2" fill="none"/></g>
  <text x="84" y="277" font-size="13" class="mono">repo-04</text>
