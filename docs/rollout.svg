  <g class="k5"><rect x="58" y="318" width="16" height="16" rx="4" fill="#238636"/><path d="M61.5 326 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2.2" fill="none"/></g>
  <text x="84" y="331" font-size="13" class="mono">repo-06</text>
