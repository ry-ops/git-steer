    .k3 { animation: k3 16.0s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes n3 { 0%,34.38% { opacity: 0; } 36.25%,96.25% { opacity: 1; } 98.75%,100% { opacity: 0; } }
