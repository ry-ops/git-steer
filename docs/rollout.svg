<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d">
  <title id="t">How a git-steer rollout works</title>
  <desc id="d">You start a rollout and git-steer opens an issue with one checkbox per repo. Nothing happens until you add the approved label. Then, every hour, git-steer works through at most five repos, one job at a time: it mints a token for that one repo, checks it, applies the change only if needed, and checks again before ticking the box. A failed check pauses the rollout; closing the issue cancels it.</desc>
