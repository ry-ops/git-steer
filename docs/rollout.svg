    .k4 { animation: k4 16.0s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes n4 { 0%,40.62% { opacity: 0; } 42.50%,96.25% { opacity: 1; } 98.75%,100% { opacity: 0; } }
    .n4 { animation: n4 16.0s infinite; }
