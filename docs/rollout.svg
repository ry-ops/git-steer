    .k5 { animation: k5 16.0s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes n5 { 0%,54.37% { opacity: 0; } 56.25%,96.25% { opacity: 1; } 98.75%,100% { opacity: 0; } }
    .n5 { animation: n5 16.0s infinite; }
    @keyframes k6 { 0%,59.94% { opacity: 0; transform: scale(.4); } 61.56%,96.25% { opacity: 1; transform: scale(1); } 98.75%,100% { opacity: 0; } }
    .k6 { animation: k6 16.0s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes n6 { 0%,60.62% { opacity: 0; } 62.50%,96.25% { opacity: 1; } 98.75%,100% { opacity: 0; } }
    .n6 { animation: n6 16.0s infinite; }
    @keyframes k7 { 0%,66.19% { opacity: 0; transform: scale(.4); } 67.81%,96.25% { opacity: 1; transform: scale(1); } 98.75%,100% { opacity: 0; } }
    .k7 { animation: k7 16.0s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes n7 { 0%,66.88% { opacity: 0; } 68.75%,96.25% { opacity: 1; } 98.75%,100% { opacity: 0; } }
    .n7 { animation: n7 16.0s infinite; }
    @keyframes k8 { 0%,72.44% { opacity: 0; transform: scale(.4); } 74.06%,96.25% { opacity: 1; transform: scale(1); } 98.75%,100% { opacity: 0; } }
    .k8 { animation: k8 16.0s infinite; transform-box: fill-box; transform-origin: center; }
