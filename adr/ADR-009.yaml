# ══════════════════════════════════════════════════════════════
# ADR-009 — git-steer v2: Repos Run Themselves, the Fleet Is Seen Whole
# Each repo owns its config and its fixes; git-steer reads the fleet
# and reports it, privately, with coverage before findings
# ══════════════════════════════════════════════════════════════

metadata:
  id: ADR-009
  title: "git-steer v2: Repos Run Themselves, the Fleet Is Seen Whole"
  status: PROPOSED
  date: "2026-10-04"
  author: "Ryan // ry-ops.dev"
  supersedes: null
  superseded_by: null
  amends:
    - ADR-008   # keeps all of its HARD constraints; settles Layer 2's design, its output target, and per-repo config/state
  affects:
    - ry-ops/git-steer
    - ry-ops/git-steer-fleet   # new private repo: runs the report, holds its output
    - all managed repos (ry-ops, git-fabric, cortex-io, fabric-forge, TAEM-DEV, m5stack-lab; ~113 repos)

context: |
  ADR-008 moved fixing down into each repo and turned git-steer into a
  read-only observer. It left three things open, and the retirement work
  (ADR-008 C-008-009, complete) has left nothing yet that does Layer 2:

    1. What the fleet view actually is. The old dashboard (scripts/ci-dashboard.mjs,
       src/dashboard/) never worked reliably: it scanned ~113 repos one at a
       time, read only the first page of alerts, and was fed by state files
       the retired control plane used to write (CVE queue, escalation, RFCs).

    2. Where reports go, given who can see them. ry-ops/git-steer is public
       and meant to be forked. ry-ops/git-steer-state is private. Many managed
       repos are private. GitHub Pages sites are public on this account's
       plan, even when built from a private repo. A fleet report published
       from git-steer, or to Pages, would disclose open vulnerabilities in
       private repos.

    3. Where per-repo state lives. Every repo needs some git-steer setting
       (opt-in, auto-merge policy, owner). A state file that changes on every
       run would mean a bot commit or PR in every repo every day: default
       branches require signed commits through PRs (C-008-006), and a daily
       write to ~113 repos is the pattern that got the account flagged.

  Two facts shape the answer. First, almost all of the state git-steer used
  to keep is already held by GitHub: alerts and their dismissal reasons, PRs
  and their checks, repo settings and rulesets. Second, Dependabot, CodeQL
  and secret scanning are good detectors but fail silently: a repo with them
  off shows zero alerts, which looks exactly like a clean repo.

  ry-ops is a personal account, so org-wide alert endpoints
  (GET /orgs/{org}/dependabot/alerts and the like) work for the five orgs but
  not for repos owned by ry-ops; those are read per repo.

decision: |
  git-steer v2 is a toolkit each repo uses on itself, plus one read-only
  fleet report. ADR-008's three layers stand; this ADR fixes how Layers 1 and
  2 are built.

    PER-REPO CONFIG — .github/git-steer.yml
      Each repo may carry a small, rarely-changed config file, added and
      edited by PR like any other change. It is optional: with no file, the
      defaults below apply. Schema version 1:

        version: 1
        enabled: true            # false = repo is listed as opted out, nothing runs
        automerge:
          patch: true            # Dependabot patch updates, via gh pr merge --auto
          minor: true
          major: false           # majors always go to a human (C-008-005)
        owner: ry-ops            # who the dashboard lists as responsible
        tier: standard           # critical | standard | experimental; sorts the dashboard

      Unknown keys are reported, not fatal. The schema lives in this repo
      (schema/git-steer.schema.json) and changes only by ADR.

    NO PER-REPO STATE FILES
      git-steer writes no state into managed repos. Everything it reports is
      derived on each run from GitHub's own records:
        - findings from Dependabot, code-scanning and secret-scanning alerts;
        - VEX from dismissed alerts: the dismissal reason and comment are the
          justification, rendered to OpenVEX (src/core/vex.ts) on demand;
        - PR health from the PRs and their check runs;
        - coverage from repo security settings and rulesets.
      If a repo later needs state GitHub does not hold, it goes in workflow
      artifacts or org custom properties, never in commits to a default
      branch, and only through a new ADR.

    FLEET REPORT — a scheduled, read-only workflow in the private fleet repo
      The code lives in git-steer; the workflow that runs it lives in the
      private fleet repo (ry-ops/git-steer-fleet) and checks git-steer out.
      Actions logs, job summaries and artifacts of a public repo are public,
      so a report run in git-steer itself would publish fleet data.
      1. Discover the fleet from the reporter App's installations. No
         hand-maintained repo list; archived repos are listed but not scored.
      2. For each repo, record coverage first: Dependabot alerts, Dependabot
         security updates, dependency graph, CodeQL, secret scanning and push
         protection on or off; default-branch ruleset present; required checks
         present; .github/git-steer.yml present and valid; heal.yml caller
         present.
      3. Then record findings: open alerts by tool and severity, alerts with no
         patched version, Dependabot PRs open more than 14 days, majors failing
         checks, dismissed alerts with no justification.
      4. Use org-wide endpoints for the orgs and per-repo calls for ry-ops,
         through the rate-limit-hardened client (src/github/client.ts).
      5. Produce status.json (versioned schema) and the dashboard from it.

    OUTPUT — private by default
      Fleet data stays in the private fleet repo the report runs in,
      ry-ops/git-steer-fleet (decided 2026-10-04; git-steer-state is not
      reused). Forks use their own private repo.
        - The dashboard is a single issue in that repo, updated in place:
          a fleet table, the coverage gaps, and the human-decision list from
          C-008-008. It is never closed while it serves as the dashboard; the
          human-decision list inside it is what empties.
        - status.json is uploaded as a workflow artifact on every run.
      Nothing fleet-specific is written to the public git-steer repo: no
      issues, no Pages, no committed data. A public view, if ever wanted,
      carries aggregate counts only, with no repo names or alert details for
      private repos, and needs its own ADR.

    TWO APPS (decided 2026-10-04)
      - git-steer-reporter: read-only. It is installed on every owner and
        used only by the fleet report. Its key cannot change anything.
      - git-steer (the existing App): cut down to the writes Layer 1 needs,
        today contents write for lockfile commits, always minted for one
        repository (C-008-002).
      The existing App held write access to administration, secrets,
      workflows, actions, Pages and more across the fleet; asking for less
      at mint time does not shrink what a leaked key can do, so the
      permissions themselves are reduced.

    FORKABLE
      Owners, orgs, the fleet repo and the Apps are configuration (repository
      variables and secrets), not code. A fork plus a private fleet repo plus
      an App installation is a working git-steer.

constraints:
  - id: C-009-001
    type: HARD
    scope: coverage-before-findings
    rule: >
      The report never shows a repo as clean unless its detectors are on. A
      repo with Dependabot alerts, the dependency graph, CodeQL or secret
      scanning off, or whose settings git-steer cannot read, is shown as
      UNKNOWN for that tool, with the reason, never as zero findings.
    check: |
      for repo, tool in report: tool.enabled != true ⇒ status(repo, tool) == UNKNOWN
    violation: NO-GO
    adr: ADR-009

  - id: C-009-002
    type: HARD
    scope: no-state-in-managed-repos
    rule: >
      git-steer stores no state in managed repos. The only git-steer file in a
      managed repo is .github/git-steer.yml, which people change by PR.
      Findings, PR health and VEX are derived from GitHub's records on each run.
    check: |
      fleet_report.write_calls(managed_repos) == 0
      && managed_repo.git_steer_files ⊆ {.github/git-steer.yml, heal.yml caller}
    violation: NO-GO
    adr: ADR-009

  - id: C-009-003
    type: HARD
    scope: private-fleet-data
    rule: >
      Fleet data (repo names, alert details, coverage gaps) goes only to the
      private fleet repo, as issues and workflow artifacts. Every job that
      handles fleet data runs in that repo, since its logs and summaries are
      fleet data too. Nothing is published to the public git-steer repo, to
      GitHub Pages, or to any public location. Report code refuses to run
      unless the repo running it is private.
    check: |
      fleet_repo.visibility == private
      && runs_handling_fleet_data ⊆ fleet_repo
      && public_outputs(fleet_report) == ∅
    violation: NO-GO
    adr: ADR-009

  - id: C-009-004
    type: HARD
    scope: read-only-reporter
    rule: >
      The fleet report reads managed repos only through the git-steer-reporter
      App, whose permissions are all read. It writes only to the fleet repo
      it runs in, with that repo's own GITHUB_TOKEN (issues write, nothing
      else). No write-capable App key is available to the report job.
    check: |
      reporter_app.permissions ⊆ read
      && report_job.writes ⊆ {fleet_repo: issues}
      && report_job.secrets ∌ writer_app_key
    violation: NO-GO
    adr: ADR-009

  - id: C-009-005
    type: HARD
    scope: discovered-fleet
    rule: >
      The fleet is the set of repos the git-steer-reporter App is installed
      on. No repo list is maintained by hand, and the report does not depend
      on any file in the fleet repo to know what to read.
    check: |
      fleet == ⋃ installations(reporter_app).repositories
    violation: WARN
    adr: ADR-009

  - id: C-009-006
    type: SOFT
    scope: optional-versioned-config
    rule: >
      .github/git-steer.yml is optional and versioned. A missing file means
      defaults; an invalid file is reported on the dashboard and the repo is
      treated as defaults, not skipped. Schema changes go through an ADR.
    check: |
      missing(config) ⇒ defaults && invalid(config) ⇒ listed && defaults
    violation: WARN
    adr: ADR-009

  - id: C-009-007
    type: SOFT
    scope: forkable
    rule: >
      No owner, org, repo name or App ID is hard-coded in workflows or source.
      They come from repository variables and secrets, with ry-ops values only
      as documented examples.
    check: |
      grep(hard-coded owners) in .github/ src/ scripts/ == ∅
    violation: WARN
    adr: ADR-009

rationale: |
  Coverage comes before findings because the worst failure for a dashboard is
  a false all-clear. Dependabot and its siblings are trustworthy when they
  run, and invisible when they don't; git-steer's job is to know which is
  which.

  Deriving state instead of storing it removes a class of bugs the old design
  had (state files drifting from reality, silent clears) and removes every
  reason to write to managed repos. GitHub already keeps the alerts, the
  dismissals and the PRs; a copy of them would only be another thing to keep
  in sync.

  The output is private because the repo is public and the fleet is not.
  An issue in a private repo is the cheapest private, always-on dashboard
  GitHub offers: it renders markdown, needs no hosting and no commits, and
  can be read from a phone. If it outgrows an issue, the status.json schema
  is what the next view is built on.

  The reporter is its own App so that the key the report holds can only
  read. A leaked reporter key exposes data but changes nothing.

  Discovering the fleet from App installations means installing the App is
  how a repo joins, and uninstalling is how it leaves, so the list can't
  drift from what git-steer can actually read.

consequences:
  positive:
    - One read-only workflow gives a full fleet view; no writes, no account risk
    - A repo with detectors off can't hide behind zero alerts
    - No per-repo churn; the only file in each repo changes when its policy does
    - VEX needs no separate store; dismissals are the record
    - A fork is configuration, not code changes
  risks:
    - risk: "The fleet repo is made public by mistake"
      mitigation: "Report code checks the running repo is private and refuses to run otherwise (C-009-003)"
    - risk: "The reporter App's key leaks"
      mitigation: "It can read alert data but change nothing; rotate the key, and the fleet is unaffected"
    - risk: "An issue body is limited to 65,536 characters"
      mitigation: "The issue shows repos with something to act on plus a one-line count of clean repos; the full table is in status.json"
    - risk: "The reporter App's permissions may not cover every read"
      mitigation: "Missing permissions show as UNKNOWN under C-009-001, with the permission named, so the gap is visible rather than silent"
    - risk: "Reads across ~113 repos could hit rate limits"
      mitigation: "Org-wide endpoints for the five orgs, ETag caching and concurrency caps from src/github/client.ts, one scheduled run per day"

resolved_questions:
  - "Output repo: a new private repo, ry-ops/git-steer-fleet; git-steer-state is not reused (2026-10-04)."
  - "App permissions: the existing App is write-heavy everywhere, so a read-only git-steer-reporter App is added and the existing one is cut down (2026-10-04). The per-repo audit runs from git-steer-fleet (scripts/app-audit.mjs)."

open_questions:
  - "Does changelog.yml (personal access token, writes to fabric-forge/blog) stay, change, or go under ADR-008 and this ADR?"
