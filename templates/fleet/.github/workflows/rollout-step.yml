name: Rollout step

# Works approved rollout issues (ADR-010): each hour, at most 5 targets across
# all rollouts, one job per target, one at a time. Each job mints a
# git-steer-admin token for its one repo (C-010-001), checks, applies only if
# needed, and checks again (C-010-004). This workflow never picks targets
# itself; it only continues rollouts a person started and the owner approved
# (C-010-002).

on:
  schedule:
    - cron: '41 * * * *'   # hourly
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rollout-step
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Check out git-steer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.GIT_STEER_REPO || 'ry-ops/git-steer' }}
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Plan this hour
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/rollout-plan.mjs
          echo "matrix=$(cat plan.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' plan.json)" >> "$GITHUB_OUTPUT"

  apply:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fleet-write
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    steps:
      - name: Refuse anything but a single repo target
        env:
          REPO_NAME: ${{ matrix.repo }}
        run: test -n "$REPO_NAME"

      # One token per job, for this one repo, with only what its change needs
      # (C-010-001, ADR-011): settings changes get Administration; merging a
      # Dependabot PR gets contents and pull requests, plus read on checks.
      - name: Mint a git-steer-admin token for this one repo (settings)
        id: token_admin
        if: matrix.change != 'merge-dependabot-pr'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo }}
          permission-administration: write

      - name: Mint a git-steer-admin token for this one repo (merging)
        id: token_merge
        if: matrix.change == 'merge-dependabot-pr'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Check out git-steer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.GIT_STEER_REPO || 'ry-ops/git-steer' }}
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Check, apply, check
        env:
          GH_TOKEN: ${{ steps.token_admin.outputs.token || steps.token_merge.outputs.token }}
          CHANGE: ${{ matrix.change }}
          TARGET: ${{ matrix.target }}
          ISSUE: ${{ matrix.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/rollout-apply.mjs

      # If the job broke before rollout-apply wrote a result (e.g. no token
      # because the App isn't installed on this owner), record a failure so
      # the rollout pauses instead of retrying this target every hour.
      - name: Record a failure if there's no result
        if: failure()
        env:
          ISSUE: ${{ matrix.issue }}
          CHANGE: ${{ matrix.change }}
          TARGET: ${{ matrix.target }}
          TOKEN_OUTCOME: ${{ steps.token_admin.outcome == 'failure' && 'failure' || steps.token_merge.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f result.json ]; then exit 0; fi
          reason="job failed before a result; see the run"
          if [ "$TOKEN_OUTCOME" = "failure" ]; then
            reason="no git-steer-admin token for this repo; is the App installed on its owner with access to it?"
          fi
          jq -n --argjson issue "$ISSUE" --arg change "$CHANGE" --arg target "$TARGET" --arg reason "$reason" --arg run "$RUN_URL" \
            '{issue: $issue, change: $change, target: $target, outcome: "failed", before: "not checked", after: $reason, runUrl: $run, at: (now | todate)}' > result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-${{ matrix.key }}
          path: result.json
          retention-days: 7
          if-no-files-found: ignore

  record:
    needs: [plan, apply]
    if: always() && needs.plan.outputs.count != '0' && needs.plan.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out git-steer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.GIT_STEER_REPO || 'ry-ops/git-steer' }}
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-*
          path: results

      - name: Record on the rollout issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/rollout-record.mjs
